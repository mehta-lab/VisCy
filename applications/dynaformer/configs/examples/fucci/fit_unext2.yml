# From-scratch model: UNeXt2 encoder + temporally-conditioned UNeXt2 decoder.
# Usage: cd applications/dynaformer/configs/examples && uv run python -m dynaformer fit -c fucci/fit_unext2.yml
#
# Downloads nothing, so this is the leaf to start from when checking a dataset
# or a change to the training loop.
base:
  - ../../recipes/trainer/fit.yml
  - ../../recipes/topology/single_gpu.yml
  - ../../recipes/data/track_window_fucci.yml
  - ../../recipes/models/unext2_temporal.yml

trainer:
  precision: 16-mixed
  max_epochs: 100
  callbacks:
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: dynaformer.evaluation.TrackTrajectoryMetrics
      init_args:
        channel_names: [mKO, mVenus]
        readout: ratio
        channels: [0, 1]
        scalar_head_name: scalar
        every_n_epochs: 1
        max_tracks: 32
        max_frames: 128
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/track_pearson/image
        mode: max
        every_n_epochs: 1
        save_top_k: 5
        save_last: true

data:
  init_args:
    data_path: #TODO HCS OME-Zarr plate
    tracks_path: #TODO directory of per-FOV tracking CSVs
