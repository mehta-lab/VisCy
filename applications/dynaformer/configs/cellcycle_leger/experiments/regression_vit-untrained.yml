# regression with vit-untrained embeddings of the Leger et al. RPE1 brightfield tracks; the model, optimizer and
# budget are configs/cellcycle's regression task.
# Usage: ../submit.sh -- regression_vit-untrained.yml
base:
  - ../recipes/trainer.yml
  - ../recipes/data.yml
  - ../../cellcycle/recipes/tasks/regression.yml
  - ../recipes/encoders/vit-untrained.yml
trainer:
  logger:
    init_args:
      name: regression_vit-untrained
