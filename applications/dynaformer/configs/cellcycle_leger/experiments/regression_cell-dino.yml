# regression with cell-dino embeddings of the Leger et al. RPE1 brightfield tracks; the model, optimizer and budget are
# configs/cellcycle's regression task.
# Usage: ../submit.sh -- regression_cell-dino.yml
base:
  - ../recipes/trainer.yml
  - ../recipes/data.yml
  - ../../cellcycle/recipes/tasks/regression.yml
  - ../recipes/encoders/cell-dino.yml
trainer:
  logger:
    init_args:
      name: regression_cell-dino
