# regression with morphem embeddings of the Leger et al. RPE1 brightfield tracks; the model, optimizer and budget are
# configs/cellcycle's regression task.
# Usage: ../submit.sh -- regression_morphem.yml
base:
  - ../recipes/trainer.yml
  - ../recipes/data.yml
  - ../../cellcycle/recipes/tasks/regression.yml
  - ../recipes/encoders/morphem.yml
trainer:
  logger:
    init_args:
      name: regression_morphem
