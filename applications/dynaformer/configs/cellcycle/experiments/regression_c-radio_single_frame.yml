# Ablation: regression_c-radio with the temporal transformer removed. n_layers 0 leaves T as its final LayerNorm, so
# every prediction reads its own frame's embedding only; everything else is identical to regression_c-radio.yml.
base:
  - regression_c-radio.yml
model:
  init_args:
    model:
      init_args:
        temporal:
          init_args:
            n_layers: 0
trainer:
  logger:
    init_args:
      name: regression_c-radio_single_frame
