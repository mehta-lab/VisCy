# Encoder recipe: no foundation model, E trained with the rest of the model. MorphEm's ViT-S/16 architecture from the
# random initialization that vit-untrained keeps frozen (seed 0), run on the centred phase crop of every frame at every
# step instead of read from a cache: 384 class token + 384 centre patch mean.
data:
  init_args:
    embeddings: null
    phase_frames: true
model:
  init_args:
    model:
      init_args:
        embed_dim: 768
        encoder:
          class_path: dynaformer.models.FoundationFrameEncoder
          init_args:
            name: vit-untrained
            trainable: true
