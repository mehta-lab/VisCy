# DynaCLR-3D-Gut-MultiChannel (Phase 2)
# ======================================
# 4-channel contrastive learning on Zuben's zebrafish gut data.
# All channels stacked as input (nuclear, septate, brush_border, SuH) →
# (B, 4, 24, 64, 64). Per-channel normalization: each channel normalized with
# its own per-FOV full-frame stats from the v3 .zattrs.
#
# STATIC DATA: SimCLR self-positive (Phase 2a). Switch to consecutive-stage
# positives later — see plan (needs a stage-adjacency bucket or code change).
#
# Z window centered on each cell's parquet `z` (z_center_source=cell_z), 24
# slices, no random Z crop. XY extracted at 80 then center-cropped to 64.
#
# Launch:
#   sbatch applications/dynaclr/configs/training/DynaCLR-3D/DynaCLR-3D-Gut-MultiChannel.sh

base:
  - ../recipes/trainer/fit.yml
  - ../recipes/topology/ddp_2gpu.yml
  - ../recipes/model/contrastive_encoder_convnext_tiny.yml

trainer:
  precision: bf16-mixed
  max_epochs: 150
  logger:
    init_args:
      project: DynaCLR-3D-Gut-MultiChannel
      name: gut-3d-4ch-z24-cellz-64-ntxent-t0p2-self
  callbacks:
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: loss/val
        every_n_epochs: 1
        save_top_k: 5
        save_last: true

model:
  init_args:
    encoder:
      init_args:
        in_channels: 4
        in_stack_depth: 24
        stem_kernel_size: [4, 4, 4]
        stem_stride: [4, 4, 4]
        projection_dim: 32
        drop_path_rate: 0.1
    loss_function:
      init_args:
        temperature: 0.2
    lr: 0.00002
    pca_color_keys: "[perturbation,experiment,marker]"
    log_negative_metrics_every_n_epochs: 2
    example_input_array_shape: [1, 4, 24, 64, 64]

data:
  class_path: dynaclr.data.datamodule.MultiExperimentDataModule
  init_args:
    cell_index_path: /hpc/projects/jacobo_group/collab/ed/dynaclr/dynaclr_cell_index_gut_v1.parquet
    focus_channel: null
    z_center_source: cell_z
    z_window: 24
    z_extraction_window: 24
    z_focus_offset: 0.5
    yx_patch_size: [80, 80]
    final_yx_patch_size: [64, 64]
    # All 4 channels stacked per sample → (B, 4, Z, Y, X).
    channels_per_sample: null
    positive_cell_source: self
    stratify_by: [perturbation]
    split_mode: cell
    split_ratio: 0.8
    batch_size: 64
    num_workers: 4
    seed: 42
    # Per-channel normalization: each channel keyed by its real name, all at
    # fov_statistics (== timepoint_statistics for single-timepoint data).
    normalizations:
      - class_path: viscy_transforms.NormalizeSampled
        init_args:
          keys: [nuclear]
          level: fov_statistics
          subtrahend: mean
          divisor: std
      - class_path: viscy_transforms.NormalizeSampled
        init_args:
          keys: [septate]
          level: fov_statistics
          subtrahend: mean
          divisor: std
      - class_path: viscy_transforms.NormalizeSampled
        init_args:
          keys: [brush_border]
          level: fov_statistics
          subtrahend: mean
          divisor: std
      - class_path: viscy_transforms.NormalizeSampled
        init_args:
          keys: [SuH]
          level: fov_statistics
          subtrahend: mean
          divisor: std
    augmentations:
      - class_path: viscy_transforms.BatchedRandAffined
        init_args:
          keys: [nuclear, septate, brush_border, SuH]
          prob: 0.8
          scale_range: [[0.9, 1.1], [0.9, 1.1], [0.9, 1.1]]
          rotate_range: [3.14, 0.0, 0.0]
          shear_range: [0.05, 0.05, 0.0, 0.05, 0.0, 0.05]
      - class_path: viscy_transforms.BatchedRandFlipd
        init_args:
          keys: [nuclear, septate, brush_border, SuH]
          spatial_axes: [1, 2]
          prob: 0.5
      - class_path: viscy_transforms.BatchedRandAdjustContrastd
        init_args:
          keys: [nuclear, septate, brush_border, SuH]
          prob: 0.5
          gamma: [0.6, 1.6]
      - class_path: viscy_transforms.BatchedRandScaleIntensityd
        init_args:
          keys: [nuclear, septate, brush_border, SuH]
          prob: 0.5
          factors: 0.5
      - class_path: viscy_transforms.BatchedRandGaussianSmoothd
        init_args:
          keys: [nuclear, septate, brush_border, SuH]
          prob: 0.5
          sigma_x: [0.25, 0.50]
          sigma_y: [0.25, 0.50]
          sigma_z: [0.0, 0.2]
      - class_path: viscy_transforms.BatchedRandGaussianNoised
        init_args:
          keys: [nuclear, septate, brush_border, SuH]
          prob: 0.5
          mean: 0.0
          std: 0.1
