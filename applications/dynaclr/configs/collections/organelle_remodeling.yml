name: organelle_remodeling
description: "Merged organelle-remodeling collection: SEC61B (ER), TOMM20 (mitochondria),
  G3BP1 (stress granules), CAAX (membrane), and H2B (nuclear) reporters under
  ZIKV/DENV infection. One experiment per physical dataset, including five annotated
  Mantis v1 datasets from 2025. All are prepared on VAST (normalization + focus_slice).
  mCherry viral sensor marker matches Airtable channel_2_marker: pAL17 for ZIKV,
  pAL40 for DENV. GFP reporter per Airtable.
  2026_04_21_A549_G3BP1_DENV re-concatenated to a flat store on VAST (odd 5-assemble
  layout resolved); focus_slice has a few z_focus=0 frames on 12/54 FOVs (mean 2.4 t each).
  Used by the organelle_remodeling model matrix (DynaCLR, MorphEm, CELL-DINO, and
  DINOv3), which fans out predict per experiment and skips already-embedded datasets."
datasets_root: /hpc/projects/organelle_phenotyping/datasets

provenance:
  airtable_base_id: app8vqaoWyOwa0sB5
  created_by: "eduardo.hirata"

experiments:
  # --- DENV, SEC61B (ER) ---
  - name: 2024_11_07_A549_SEC61_DENV
    data_path: ${datasets_root}/2024_11_07_A549_SEC61_DENV/2024_11_07_A549_SEC61_DENV.zarr
    tracks_path: ${datasets_root}/2024_11_07_A549_SEC61_DENV/tracking.zarr
    channels:
      - name: raw GFP EX488 EM525-45
        marker: SEC61B
      - name: raw mCherry EX561 EM600-37
        marker: pAL40
      - name: Phase3D
        marker: Phase3D
    perturbation_wells:
      uninfected: [B/1, B/3]
      DENV: [B/2, C/2]
    exclude_fovs: [C/1/000000]
    interval_minutes: 10.0
    start_hpi: 4.0
    moi: 5.0
    organelle: endoplasmic_reticulum
    pixel_size_xy_um: 0.1494
    pixel_size_z_um: 0.174
    microscope: mantis_v1

  - name: 2026_04_14_A549_SEC61B_DENV
