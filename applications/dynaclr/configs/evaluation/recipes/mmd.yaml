# Standalone per-experiment biological MMD example.
# Replace input/output paths and condition labels for the dataset.
input_path: /path/to/experiment_marker_embeddings.zarr
output_dir: /path/to/mmd_results

group_by: perturbation
comparisons:
  - cond_a: uninfected
    cond_b: DENV
    label: uninfected_vs_DENV

# Defaults shown explicitly for reproducibility.
representation:
  normalization: control_mad
  control_key: perturbation
  control_values: [uninfected]
  experiment_key: experiment
  marker_key: marker
  hpi_key: hours_post_perturbation
  smooth_sigma_timepoints: 2.0
  mad_floor_quantile: 0.05
  pca_variance: 0.80
  pca_max_cells_per_dataset_class: 5000
  random_seed: 42

# Set to null for one aggregate comparison or provide explicit temporal_bins.
temporal_bin_size: 0.5
save_plots: true

mmd:
  n_permutations: 1000
  max_cells: 2000
  min_cells: 20
  seed: 42
  balance_samples: true
  share_bandwidth_from: null

map_settings:
  enabled: false
