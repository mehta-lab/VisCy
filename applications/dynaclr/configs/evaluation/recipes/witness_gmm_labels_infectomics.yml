# Witness-GMM annotations → linear classifiers — infectomics benchmark.
#
# TWO STAGES (see applications/dynaclr/docs/DAGs/witness_gmm_classifiers.md):
#
#   Stage A  `dynaclr witness-gmm-labels -c <this file>`
#     Scores cells with the MMD witness, gates each perturbed condition with a
#     2-component GMM, and writes an ANNOTATION FILE (a named biological-state
#     column with the real class vocabulary). A witness→GMM label IS an
#     annotation — from viral_sensor it is infection_state; from an organelle
#     marker it is organelle_remodeling_state. One marker/microscope per config.
#
#   Stage B  `dynaclr run-linear-classifiers -c <a train config>`
#     The EXISTING annotation path — point `annotations:` at the Stage-A output
#     file and `tasks:` at its label_column. Same-modality trains on the labeled
#     zarr; teacher/student points `embeddings_path` at a different modality.
#
# The control/perturbed filters below are TEMPLATES — edit per plate layout.
# Cells in neither reference are dropped, so dead/empty wells never leak.

# ─────────────────────────── STAGE A ───────────────────────────
witness_gmm_labels:
  experiments:
    - experiment: "2025_07_24_A549_viral_sensor_ZIKV"
      embeddings_zarr: "/path/to/2025_07_24_A549_viral_sensor_ZIKV/embeddings"
      # Both references are pooled by well identity across ALL timepoints (default).
      # The perturbed cloud is intentionally a MIXTURE (early cells not yet remodeled +
      # late remodeled cells) — the per-condition GMM separates the remodeled mode from
      # that mixture, so no time gate is needed. A time gate here would discard data and
      # re-introduce a hand-tuned threshold (the thing the GMM replaces). Only add
      # `hours_post_perturbation: {ge: N}` to the perturbed_filter if you have a specific
      # reason to pre-restrict the reference.
      control_filter: {perturbation: uninfected}
      perturbed_filter: {perturbation: [ZIKV]}
  # From viral_sensor the witness axis means infection.
  marker_filters: [viral_sensor]
  label_column: infection_state
  class_map: {positive: infected, negative: uninfected}
  gmm_pos_threshold: 0.8
  # Significance gate (target FDR level): each condition's MMD vs the control
  # reference is permutation-tested; raw p-values across the whole run's
  # (marker, condition) family get Benjamini-Yekutieli FDR correction, and a
  # condition is skipped when its ADJUSTED p exceeds this level. A condition is
  # labeled only if BOTH FDR-significant AND GMM-bimodal. Set to 1.0 to disable.
  mmd_pvalue_threshold: 0.05
  mmd_n_permutations: 1000
  bandwidth: null                # median heuristic on pooled (control, perturbed)
  max_reference_cells: 5000
  condition_column: perturbation
  # Stage-A outputs land under <output_dir>/labels/: the annotation file
  # (<label_column>.<annotation_format>) plus a plots/ subdir with the
  # label-decision evidence (witness-GMM fit, MMD permutation null, and
  # %-remodeling-vs-time). Point output_dir at the checkpoint root so Stage B
  # can write its trained classifiers to a sibling <output_dir>/classifiers/.
  output_dir: "/path/to/model/ckpt"
  annotation_format: csv

# For an organelle marker, run a SECOND Stage-A config with:
#   marker_filters: [SEC61B]
#   label_column: organelle_remodeling_state
#   class_map: {positive: remodel, negative: noremodel}

# ─────────────────────────── STAGE B ───────────────────────────
# Train through the unchanged annotation path on the Stage-A output.
linear_classifiers:
  label_source: annotations
  annotations:
    - experiment: "2025_07_24_A549_viral_sensor_ZIKV"
      # Stage-A output: <output_dir>/labels/<marker(s)>_<label_column>.<annotation_format>
      path: "/path/to/model/ckpt/labels/viral_sensor_infection_state.csv"
  tasks:
    - task: infection_state
      marker_filters: [viral_sensor]
  use_scaling: true
  use_pca: false
  split_train_data: 0.8
  random_seed: 42
  # Track-level split — no track lands in both train/val (temporal-contrastive
  # SSL leaks on cell-level splits).
  split_groups_by:
    - experiment
    - fov_name
    - track_id
