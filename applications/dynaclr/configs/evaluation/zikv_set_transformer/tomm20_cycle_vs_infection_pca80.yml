deviations:
- 'Infection AUROC: added variant B with reference bags matched to each τ bag''s (dataset, 2 h HPI bin) composition (cross-dataset only where a fold''s reference test pool lacks that dataset), because the HPI-only baseline separates τ bags from pool references almost perfectly; variant A is the specified analysis.'
- Analysis bags (AUROC, confusion, cross-checks) use the largest eval size ≤ the chosen size and ≤ half the smallest CV test pool (10 cells), not the chosen training size, because late τ test pools (21–48 cells) are smaller than the chosen size; eval.py lists are capped per fold at the smallest test pool.
- Classes are also dropped from a fold if their val or test pool is empty (an empty pool would give all-masked bags); no class was dropped.
- 'Hydra configs: num_workers 0 (≤ 8 threads on the shared node) and eval show_progress false; everything else as shipped. Training seed 42 as shipped; our sampling uses seed 17.'
- Cross-scoring adds a random same-class (forward) and random post-onset (reverse) comparator next to the specified random reference cells; the reverse random reference is also matched on source (bystander or control); the UMAP figure adds a Cell-cycle classifier panel.
- 'Provenance: the export and run stages ran with an earlier revision of this wrapper (same export/run logic; later edits changed analyze/render/report, export-record tabulation, the label-path check and line wrapping); analyze, render and report were re-run with the revision recorded in manifest.json.'
