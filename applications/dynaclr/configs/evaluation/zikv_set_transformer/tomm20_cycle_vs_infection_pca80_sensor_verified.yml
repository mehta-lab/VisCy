report_notes:
- 'Visual check of the montages (bystander question): none of the top 10 BYSTANDER cells shows nuclear pAL17 (attempt 25 had a few); one (04_10 B/2/0002 track 36, 5 HPI) has bright diffuse cytoplasmic pAL17, and one top cell-cycle-classifier G2 cell from a bystander lineage (07_01 B/3/003000 track 146, 36 HPI) shows faint diffuse nuclear pAL17.'
deviations:
- 'Lineage labels: onset (τ classes) and BYSTANDER lineages must have the same class under the Phase→pAL TCN and the pAL17 sensor (onset = any infected or pre_onset frame); discordant and ambiguous ZIKV lineages are excluded; τ stays the TCN tau_h, so the bins are unchanged; CONTROL is unchanged.'
- 'Infection AUROC: added variant B with reference bags matched to each τ bag''s (dataset, 2 h HPI bin) composition (cross-dataset only where a fold''s reference test pool lacks that dataset), because the HPI-only baseline separates τ bags from pool references almost perfectly; variant A is the specified analysis.'
- Analysis bags (AUROC, confusion, cross-checks) use the largest eval size ≤ the chosen size and ≤ half the smallest CV test pool, not the chosen training size, because late τ test pools are smaller than the chosen size; eval.py lists are capped per fold at the smallest test pool.
- Classes are also dropped from a fold if their val or test pool is empty (an empty pool would give all-masked bags).
- 'Hydra configs: num_workers 0 (≤ 8 threads on the shared node) and eval show_progress false; everything else as shipped. Training seed 42 as shipped; our sampling uses seed 17.'
- Cross-scoring adds a random same-class (forward) and random post-onset (reverse) comparator next to the specified random reference cells; the reverse random reference is also matched on source (bystander or control); the UMAP figure adds a cell-cycle-classifier panel.
- TCN labels are read from the fixed snapshot fig6_inputs/attempt23_phase_embedding_e017ba39.parquet (sha256 asserted); the sensor table's sha256 is asserted too.
- Folds deal FOVs round-robin within well type across datasets, so each fold has 2 control FOVs but 07_01's 4 control FOVs cannot reach all 5 folds (fold0 test lacks one).
- 'Provenance: export, run and analyze ran with a revision of the wrapper that differs from the final one only in render/report code (comparison-table rows, the M-row rule text, the lineage-count table and docstring wording); render and report were re-run with the final revision recorded in manifest.json.'
