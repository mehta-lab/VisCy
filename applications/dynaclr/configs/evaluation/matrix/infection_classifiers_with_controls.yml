# Infection-state probe for direct organelle-remodeling matrix evaluation.
#
# Manual infection annotations supply perturbed-well infected/bystander labels.
# Every true-control row in each annotation-bearing experiment is synthesized as
# infection_state=uninfected from obs[perturbation]. Experiments without a manual
# infection annotation source remain excluded, so pseudo-only negatives cannot enter.
# training_config/output_dir are required by EvaluationConfig but unused by the
# direct run-matrix-eval linear-classifier worker.

training_config: unused-by-direct-matrix-eval
output_dir: unused-by-direct-matrix-eval
steps:
- linear_classifiers
linear_classifiers:
  annotations:
  - experiment: 2024_11_07_A549_SEC61_DENV
    path: /hpc/projects/organelle_phenotyping/datasets/annotations/2024_11_07_A549_SEC61_DENV/2024_11_07_A549_SEC61B_DENV_combined_annotations.csv
  - experiment: 2025_01_24_A549_G3BP1_DENV
    path: /hpc/projects/organelle_phenotyping/datasets/annotations/2025_01_24_A549_G3BP1_DENV/2025_01_24_A549_G3BP1_DENV_combined_annotations.csv
  - experiment: 2025_01_28_A549_G3BP1_ZIKV_DENV
    path: /hpc/projects/organelle_phenotyping/datasets/annotations/2025_01_28_A549_G3BP1_ZIKV_DENV/2025_01_28_A549_G3BP1_ZIKV_DENV_combined_annotations.csv
  - experiment: 2025_07_22_A549_SEC61_TOMM20_G3BP1_ZIKV
    path: /hpc/projects/organelle_phenotyping/datasets/annotations/2025_07_22_A549_SEC61_TOMM20_G3BP1_ZIKV/2025_07_22_A549_SEC61_TOMM20_G3BP1_ZIKV_combined_annotations.csv
  - experiment: 2025_07_24_A549_SEC61_TOMM20_G3BP1_ZIKV
    path: /hpc/projects/organelle_phenotyping/datasets/annotations/2025_07_24_A549_SEC61_TOMM20_G3BP1_ZIKV/2025_07_24_A549_SEC61_TOMM20_G3BP1_ZIKV_combined_annotations.csv
  - experiment: 2025_08_26_A549_SEC61_TOMM20_ZIKV
    path: /hpc/projects/organelle_phenotyping/datasets/annotations/2025_08_26_A549_SEC61_TOMM20_ZIKV/2025_08_26_A549_SEC61_TOMM20_ZIKV_combined_annotations.csv
  tasks:
  - task: infection_state
  control_pseudolabels:
    infection_state: uninfected
  control_condition_column: perturbation
  control_condition_values:
  - uninfected
  - mock
  use_scaling: true
  use_pca: false
  split_train_data: 0.8
  random_seed: 42
  split_groups_by:
  - experiment
  - fov_name
  - track_id
