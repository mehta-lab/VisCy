# Direct, progressive evaluation plan for the organelle-remodeling model matrix.
#
# Evaluation Step 0 prepares/reuses X_control_mad and then fits the pooled,
# marker-specific X_normalized_pca80 before any metric job starts. Raw model X
# remains the prediction product; these two arrays belong to analysis.
#
# Preview missing model x evaluation units (including Step 0 when stale):
#   uv run --package dynaclr dynaclr run-matrix-eval -c applications/dynaclr/configs/evaluation/matrix/organelle_remodeling.yml --dry-run
# Submit only missing/stale units (default):
#   uv run --package dynaclr dynaclr run-matrix-eval -c applications/dynaclr/configs/evaluation/matrix/organelle_remodeling.yml
# Force every selected unit:
#   uv run --package dynaclr dynaclr run-matrix-eval -c applications/dynaclr/configs/evaluation/matrix/organelle_remodeling.yml --overwrite
# Compare raw .X instead of the default normalized representation:
#   ... --embedding-key X

matrix: applications/dynaclr/configs/matrix/organelle_remodeling.yml
output_root: /hpc/projects/intracellular_dashboard/organelle_dynamics/matrix_evaluations/organelle_remodeling
embedding_key: X_normalized_pca80

prepare_representation:
  enabled: true
  recipe: applications/dynaclr/configs/evaluation/recipes/witness_gmm_pooled_joint_pca80.yaml
  resources:
    partition: cpu
    cpus: 8
    memory: 128G
    time: 1-00:00:00

resources:
  partition: cpu
  cpus: 8
  memory: 128G
  time: 1-00:00:00

evaluations:
  - name: embedding_consistency
    type: embedding_consistency
    config: applications/dynaclr/configs/evaluation/recipes/embedding_consistency_qc_normalized.yml

  - name: temporal_smoothness
    type: smoothness
    parameters:
      distance_metric: cosine
      group_by: null
      save_plots: true
      save_distributions: false
      verbose: false

  # Historical mixed-task infectomics probe. Keep its completed outputs for
  # comparison, but do not schedule it in the maintained matrix evaluation.
  - name: linear_classifiers
    type: linear_classifiers
    config: model.eval_config
    parameters:
      publish: false
    enabled: false

  # Infection-only probe: manual perturbed-well labels plus systematic true-control
  # pseudolabels in every annotation-bearing experiment.
  - name: infection_classifiers
    type: linear_classifiers
    config: applications/dynaclr/configs/evaluation/matrix/infection_classifiers_with_controls.yml
    parameters:
      publish: false
