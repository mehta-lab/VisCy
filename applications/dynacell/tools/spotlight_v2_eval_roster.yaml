# Roster for tools/generate_spotlight_v2_eval_configs.py (plan: ~/.claude/plans/spotlight-v2.md).
# One wave = one set of buckets, spotlight_v2_<organelle>_<leaf>__<wave>. Append a NEW wave for
# new arms (segaux, seed replicates, fcmae_vscyto3d_scratch_v2, clipped stores) so re-running it
# never re-scores an earlier wave's conditions. Entries are paths.PAPER_KEY model tokens; the
# store defaults to the canonical <organelle>/<model>/ipsc/<leaf>/prediction.zarr. Per entry,
# `leaves: [...]` narrows the test legs and `pred_paths: {<leaf>: <path>}` points at a
# non-canonical store.
leaves: [ipsc, a549__mock, a549__denv, a549__zikv]
waves:
  # Stage 0d/0e: the 8 baselines + the 4 v1 Spotlight arms. fcmae_vscyto3d_scratch is the April
  # model (ep 111/200 nucleus, 147/200 membrane), a placeholder until the fresh retrain lands as
  # fcmae_vscyto3d_scratch_v2 in a later wave. celldiff_r2_iterative is the celldiff/ipsc_confocal
  # leaf (checkpoints under .../celldiff_r2/).
  stage0:
    nucleus: &stage0_models
      - fnet2d
      - fnet3d_paper
      - fcmae_vscyto2d_scratch
      - fcmae_vscyto3d_scratch
      - pix2pix2d_unetvit
      - pix2pix3d_unetvit
      - celldiff_2d
      - celldiff_r2_iterative
      - fnet2d_spotlight
      - fnet3d_spotlight
      - pix2pix2d_unetvit_spotlight
      - pix2pix3d_unetvit_spotlight
    membrane: *stage0_models
  # Stage 1, first finished predicts (2026-09-25): pix2pix2d arms, scored ahead of wave1 so they
  # do not wait on its slow 3D/CellDiff stores. Generate with --wave wave1a.
  wave1a:
    nucleus:
      - pix2pix2d_unetvit_segaux
      - {model: pix2pix2d_unetvit_seed1, leaves: [ipsc]}
    membrane:
      - {model: pix2pix2d_unetvit_seed1, leaves: [ipsc]}
  # The pix2pix2d BASELINE re-predicted from its own last.ckpt (predict-only arm), so GAN
  # arm-vs-baseline compares final checkpoints on both sides. Generate with --wave wave1c.
  wave1c:
    nucleus: [pix2pix2d_unetvit_last]
    membrane: [pix2pix2d_unetvit_last]
  # Cosmetic-vs-structural control for the 3D nucleus segaux A549 gain (2026-09-29): each v2
  # baseline's prediction histogram-matched per (position, T) volume to its segaux arm's, spatial
  # structure kept. Stores written by experiments/2026-09-24_spotlight-v2/histmatch_control.py.
  # Generate with --wave ctrl1.
  ctrl1:
    nucleus:
      - model: fnet3d_paper_histmatch
        leaves: [a549__mock, a549__denv, a549__zikv]
        pred_paths:
          a549__mock: /hpc/projects/virtual_staining/training/dynacell/_spotlight_v2_controls/nucleus/fnet3d_paper_histmatch/ipsc/a549__mock/prediction.zarr
          a549__denv: /hpc/projects/virtual_staining/training/dynacell/_spotlight_v2_controls/nucleus/fnet3d_paper_histmatch/ipsc/a549__denv/prediction.zarr
          a549__zikv: /hpc/projects/virtual_staining/training/dynacell/_spotlight_v2_controls/nucleus/fnet3d_paper_histmatch/ipsc/a549__zikv/prediction.zarr
      - model: pix2pix3d_unetvit_v2_histmatch
        leaves: [a549__mock, a549__denv, a549__zikv]
        pred_paths:
          a549__mock: /hpc/projects/virtual_staining/training/dynacell/_spotlight_v2_controls/nucleus/pix2pix3d_unetvit_v2_histmatch/ipsc/a549__mock/prediction.zarr
          a549__denv: /hpc/projects/virtual_staining/training/dynacell/_spotlight_v2_controls/nucleus/pix2pix3d_unetvit_v2_histmatch/ipsc/a549__denv/prediction.zarr
          a549__zikv: /hpc/projects/virtual_staining/training/dynacell/_spotlight_v2_controls/nucleus/pix2pix3d_unetvit_v2_histmatch/ipsc/a549__zikv/prediction.zarr
      - model: fcmae_vscyto3d_scratch_v2_histmatch
        leaves: [a549__mock, a549__denv, a549__zikv]
        pred_paths:
          a549__mock: /hpc/projects/virtual_staining/training/dynacell/_spotlight_v2_controls/nucleus/fcmae_vscyto3d_scratch_v2_histmatch/ipsc/a549__mock/prediction.zarr
          a549__denv: /hpc/projects/virtual_staining/training/dynacell/_spotlight_v2_controls/nucleus/fcmae_vscyto3d_scratch_v2_histmatch/ipsc/a549__denv/prediction.zarr
          a549__zikv: /hpc/projects/virtual_staining/training/dynacell/_spotlight_v2_controls/nucleus/fcmae_vscyto3d_scratch_v2_histmatch/ipsc/a549__zikv/prediction.zarr
  # CELL-Diff A549 legs that finished after wave2g (2026-09-30): the CELL-Diff-2D membrane
  # segauxself DENV/MOCK legs, the last CELL-Diff-3D nucleus segaux leg and the first
  # CELL-Diff-2D membrane seed1 A549 leg. Generate with --wave wave2j.
  wave2j:
    nucleus:
      - {model: celldiff_segaux_iterative, leaves: [a549__denv]}
    membrane:
      - {model: celldiff_2d_segauxself, leaves: [a549__mock, a549__denv]}
      - {model: celldiff_2d_seed1, leaves: [a549__denv]}
  # FNet-3D vscyto3daug ER segaux arm (fit 36933617, max_steps 200000, --ckpt best epoch 86),
  # 2026-10-04: all four legs. Read against the wave2s ER baselines; cubic 0.9.0a4 eval venv.
  # Generate with --wave wave2t.
  wave2t:
    er:
      - fnet3d_vscyto3daug_segaux
  # First ER/mito wave (2026-10-04, all four legs): the FNet-3D vscyto3daug v2
  # baselines the ER/mito Spotlight arms are read against -- ER at two seeds (epoch 90 / 68),
  # mito seed 0 (epoch 62). Scored like the canonical er_/mitochondria_ grouped leaves (semantic
  # Dice, no instance AP); submit in the cubic 0.9.0a4 eval venv. Generate with --wave wave2s.
  wave2s:
    er:
      - fnet3d_vscyto3daug_v2
      - fnet3d_vscyto3daug_v2_seed1
    mito:
      - fnet3d_vscyto3daug_v2
  # FNet-3D vscyto3daug nucleus SAUNA-map-weighted Dice arm (Stage 2 #5; fit 36906516,
  # max_steps 200000, --ckpt best epoch 64), 2026-10-04: all four legs. Read against the
  # wave2q 2x2. Generate with --wave wave2r.
  wave2r:
    nucleus:
      - fnet3d_vscyto3daug_segaux_sauna
  # 2026-10-04, all four legs, --ckpt best:
  # - the FNet-3D vscyto3daug nucleus 2x2 (big patch + VSCyto3D augs, the OOD-competent FNet:
  #   {v2, segaux} x {seed 0, seed 1});
  # - the second draw of the fresh UNeXt2-3D baselines (the seed floor for their segaux arms).
  # Generate with --wave wave2q.
  wave2q:
    nucleus:
      - fnet3d_vscyto3daug_v2
      - fnet3d_vscyto3daug_v2_seed1
      - fnet3d_vscyto3daug_segaux
      - fnet3d_vscyto3daug_segaux_seed1
      - fcmae_vscyto3d_scratch_v2_seed1
    membrane:
      - fcmae_vscyto3d_scratch_v2_seed1
  # Second draw of the pix2pix3d nucleus segaux arm (--ckpt last, EMA), 2026-10-03: all four legs.
  # Gates the membrane pix2pix3d segaux_seed1 fit. Generate with --wave wave2p.
  wave2p:
    nucleus:
      - pix2pix3d_unetvit_segaux_seed1
  # Second draw of the UNeXt2-3D MEMBRANE segaux arm (--ckpt best epoch 164), 2026-10-02: all four legs.
  # Generate with --wave wave2o.
  wave2o:
    membrane:
      - fcmae_vscyto3d_scratch_segaux_seed1
  # Second draw of the pix2pix3d v2 MEMBRANE baseline (--ckpt last, EMA), 2026-10-02: all four legs. The DENV
  # and MOCK jobs hit their 20 h wall after writing all 12 FOVs (markers 22:09 / 22:16, kill 22:41).
  # Generate with --wave wave2n.
  wave2n:
    membrane:
      - pix2pix3d_unetvit_v2_seed1
  # Second draw of the pix2pix3d v2 nucleus baseline (--ckpt last, EMA), 2026-10-01: the
  # baseline seed spread for the OOD-competent family whose segaux arm leads on A549.
  # Generate with --wave wave2i.
  wave2i:
    nucleus:
      - pix2pix3d_unetvit_v2_seed1
  # FNet-3D nucleus segaux at 0.5x seg_aux_weight (loss-weight sweep, --ckpt best epoch 206),
  # 2026-10-01. Generate with --wave wave2m.
  wave2m:
    nucleus:
      - fnet3d_paper_segaux_halfw
  # FNet-3D nucleus segaux at 2x seg_aux_weight (loss-weight sweep, --ckpt best), 2026-09-30.
  # Generate with --wave wave2l.
  wave2l:
    nucleus:
      - fnet3d_paper_segaux_doublew
  # CELL-Diff A549 nucleus legs that finished after wave2j (2026-09-30): all three
  # CELL-Diff-3D C-joint legs and the CELL-Diff-2D seed1 MOCK leg. Generate with --wave wave2k.
  wave2k:
    nucleus:
      - {model: celldiff_cjoint_iterative, leaves: [a549__mock, a549__denv, a549__zikv]}
      - {model: celldiff_2d_seed1, leaves: [a549__mock]}
  # Second draw of the FNet-3D nucleus segaux arm (fit max_steps 200000, --ckpt best
  # epoch=180-step=156746), 2026-09-30. Generate with --wave wave2h.
  wave2h:
    nucleus:
      - fnet3d_paper_segaux_seed1
  # CELL-Diff A549 legs that finished after wave2f (2026-09-29): the CELL-Diff-2D C-cond arm
  # re-predicted with threshold="otsu" (its fixed-t=0.30 wave2a scores are kept aside as
  # _spotlight_v2/nucleus/celldiff_2d_ccond/ipsc/<leg>.fixed_t030), two CELL-Diff-3D segaux legs
  # and the first CELL-Diff-2D seed1 A549 leg. Generate with --wave wave2g.
  wave2g:
    nucleus:
      - {model: celldiff_2d_ccond, leaves: [a549__mock, a549__denv, a549__zikv]}
      - {model: celldiff_segaux_iterative, leaves: [a549__mock, a549__zikv]}
      - {model: celldiff_2d_seed1, leaves: [a549__denv]}
  # Second draw of the FNet-2D segaux arm (both organelles) and the UNeXt2-3D membrane segaux
  # arm (fit ep199/200, --ckpt best ep125), 2026-09-29. Generate with --wave wave2f.
  wave2f:
    nucleus:
      - fnet2d_segaux_seed1
    membrane:
      - fnet2d_segaux_seed1
      - fcmae_vscyto3d_scratch_segaux
  # Otsu-threshold C-cond iPSC legs (CELL-Diff-2D and -3D) and the CELL-Diff-2D membrane
  # segauxself ZIKV leg, 2026-09-28. Generate with --wave wave2e.
  wave2e:
    nucleus:
      - {model: celldiff_ccond_iterative, leaves: [ipsc]}
      - {model: celldiff_2d_ccond, leaves: [ipsc]}
    membrane:
      - {model: celldiff_2d_segauxself, leaves: [a549__zikv]}
  # UNeXt2-3D nucleus: the segaux arm and its fresh v2 baseline (fits ep199/200, --ckpt best
  # ep95 / ep81), 2026-09-28. Generate with --wave wave2d.
  wave2d:
    nucleus:
      - fcmae_vscyto3d_scratch_segaux
      - fcmae_vscyto3d_scratch_v2
  # Seed-replicate A549 legs (the A549 noise floor; fnet3d_paper_seed1 also checks the April
  # FNet-3D baseline store) and the fresh UNeXt2-3D membrane baseline (2026-09-28).
  # Generate with --wave wave2c.
  wave2c:
    nucleus:
      - {model: fnet2d_seed1, leaves: [a549__mock, a549__denv, a549__zikv]}
      - {model: fcmae_vscyto2d_scratch_seed1, leaves: [a549__mock, a549__denv, a549__zikv]}
      - {model: pix2pix2d_unetvit_seed1, leaves: [a549__mock, a549__denv, a549__zikv]}
      - {model: fnet3d_paper_seed1, leaves: [a549__mock, a549__denv, a549__zikv]}
    membrane:
      - {model: fnet2d_seed1, leaves: [a549__mock, a549__denv, a549__zikv]}
      - {model: fcmae_vscyto2d_scratch_seed1, leaves: [a549__mock, a549__denv, a549__zikv]}
      - {model: pix2pix2d_unetvit_seed1, leaves: [a549__mock, a549__denv, a549__zikv]}
      - {model: fcmae_vscyto2d_scratch_l1seed1, leaves: [a549__mock, a549__denv, a549__zikv]}
      - fcmae_vscyto3d_scratch_v2
  # pix2pix3d nucleus legs that finished after wave2a (2026-09-28). Generate with --wave wave2b.
  wave2b:
    nucleus:
      - {model: pix2pix3d_unetvit_segaux, leaves: [a549__zikv]}
      - {model: pix2pix3d_unetvit_v2, leaves: [a549__mock, a549__denv]}
  # Stage 1/2 batch of finished predicts (2026-09-28): 2D segauxself + l1 arms, FNet-3D,
  # pix2pix3d and CELL-Diff-3D legs that completed. (The CELL-Diff-2D C-cond arm was scored here
  # at fixed t=0.30, then moved back to wave1 for its Otsu re-predict.)
  # Generate with --wave wave2a.
  wave2a:
    nucleus:
      - {model: celldiff_cjoint_iterative, leaves: [ipsc]}
      - {model: celldiff_segaux_iterative, leaves: [ipsc]}
      - fcmae_vscyto2d_scratch_segauxself
      - {model: fnet3d_paper_seed1, leaves: [ipsc]}
      - fnet3d_paper_segaux
      - pix2pix2d_unetvit_segauxself
      - {model: pix2pix3d_unetvit_segaux, leaves: [ipsc, a549__mock, a549__denv]}
      - {model: pix2pix3d_unetvit_v2, leaves: [ipsc, a549__zikv]}
    membrane:
      - {model: celldiff_2d_segauxself, leaves: [ipsc]}
      - {model: celldiff_segaux_iterative, leaves: [ipsc]}
      - {model: fcmae_vscyto2d_scratch_l1seed1, leaves: [ipsc]}
      - fcmae_vscyto2d_scratch_l1segaux
      - fcmae_vscyto2d_scratch_segauxself
      - fnet2d_segauxself
      - fnet3d_paper_segaux
      - pix2pix2d_unetvit_segauxself
      - pix2pix3d_unetvit_segaux
      - pix2pix3d_unetvit_v2
  # Stage 1/2, third batch of finished 2D predicts (2026-09-27): CELL-Diff-2D segaux/seed1/cjoint,
  # UNeXt2-2D nucleus segaux/seed1, the first segauxself arms, the jointsteps probe and the l1
  # probe's A549 legs (its iPSC leg is in wave1b). Generate with --wave wave1d.
  wave1d:
    nucleus:
      - fcmae_vscyto2d_scratch_segaux
      - celldiff_2d_segaux
      - celldiff_2d_cjoint
      - fnet2d_segauxself
      - celldiff_2d_segauxself
      - {model: fcmae_vscyto2d_scratch_seed1, leaves: [ipsc]}
      - {model: celldiff_2d_seed1, leaves: [ipsc]}
    membrane:
      - celldiff_2d_segaux
      - {model: celldiff_2d_seed1, leaves: [ipsc]}
      - {model: fcmae_vscyto2d_scratch_jointsteps, leaves: [ipsc]}
      - {model: fcmae_vscyto2d_scratch_l1, leaves: [a549__mock, a549__denv, a549__zikv]}
  # Stage 1, second batch of finished predicts (2026-09-25): FNet-2D, UNeXt2-2D membrane
  # (segaux, seed1, l1/safecrop probes) and pix2pix2d membrane segaux. Generate with --wave wave1b.
  wave1b:
    nucleus:
      - fnet2d_segaux
      - {model: fnet2d_seed1, leaves: [ipsc]}
    membrane:
      - fnet2d_segaux
      - fcmae_vscyto2d_scratch_segaux
      - pix2pix2d_unetvit_segaux
      - {model: fnet2d_seed1, leaves: [ipsc]}
      - {model: fcmae_vscyto2d_scratch_seed1, leaves: [ipsc]}
      - {model: fcmae_vscyto2d_scratch_l1, leaves: [ipsc]}
      - {model: fcmae_vscyto2d_scratch_safecrop, leaves: [ipsc]}
  # Stage 1 first wave, now only the CELL-Diff A549 legs still predicting: do NOT run the
  # generator on it until every predict has COMPLETED -- its store gate refuses absent or
  # partial stores. The CellDiff-3D arm is keyed by its store dir celldiff_segaux_iterative
  # (checkpoints under .../celldiff_segaux/), as stage0 keys the baseline by celldiff_r2_iterative.
  wave1:
    nucleus:
      # Stage 1b (nucleus only for now): mask in the generative process.
      - {model: celldiff_ccond_iterative, leaves: [a549__mock, a549__denv, a549__zikv]}
      - {model: celldiff_2d_seed1, leaves: [a549__zikv]}
    membrane:
      - {model: celldiff_segaux_iterative, leaves: [a549__mock, a549__denv, a549__zikv]}
      - {model: celldiff_2d_seed1, leaves: [a549__mock, a549__zikv]}
