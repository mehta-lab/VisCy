# pix2pix3d_unetvit Spotlight fit overlay — modernized recipe, 4-GPU DDP variant.
#
# Identical to pix2pix3d_unetvit_fit_ddp_modernized.yml except `recon_loss`.
# Everything else must stay pinned to that file: the arm exists to isolate the
# reconstruction objective against the Run-D pix2pix3d baseline.
#
# ⚠ This overlay does NOT carry the three Run-D deltas (lambda_l1: 10.0,
# lecam_gamma: 0.3, max_epochs: 40) — they live in the LEAF
# (train_4gpu_modernized.yml) on the 3D side, unlike the 2D family where they
# are baked into the overlay. The spotlight leaves therefore repeat that block
# verbatim. Copying this overlay alone would silently give lambda_l1=100 (the
# model recipe default), LeCam 0 and 20 epochs — not a matched comparison, and
# it would invalidate the loss-calibration analysis, which is written entirely
# around lambda_l1 = 10.
#
# `recon_loss` replaces the L1 term UNDER the existing `lambda_l1` weight. That
# weight was tuned for L1's magnitude, so the swap re-balances the generator
# objective against the adversarial term. It is the campaign's main calibration
# risk: watch `loss/g_recon_masked_mse_train` / `loss/g_recon_dice_train`
# against the baseline at matched validation residual — NOT at matched step,
# where the ratio reads clean for the wrong reason.
base:
  - ../../../../../../recipes/models/pix2pix3d_unetvit.yml
  - ../../../../../../recipes/trainer/fit.yml
  - ../../../../../../recipes/topology/ddp_4gpu_gan.yml
model:
  init_args:
    loss_type: nonsat
    lambda_adv: 1.0
    r1_gamma: 10.0
    r2_gamma: 0.0
    r1_every: 16
    ema_kimg: 10.0
    lecam_gamma: 0.0
    lecam_decay: 0.9
    use_ema_at_predict: true
    lr_g: 2.0e-4
    lr_d: 2.0e-4
    schedule: WarmupCosine
    warmup_steps: 8500
    warmup_multiplier: 1e-3
    recon_loss:
      class_path: viscy_utils.losses.SpotlightLoss
      init_args:
        lambda_mse: 0.5
        sigmoid_k: -0.95
        # NO fg_threshold — inert when the leaf sets fg_mask_key; see
        # fnet3d_spotlight_fit.yml for why setting it would be misleading.
trainer:
  precision: bf16-mixed
  max_epochs: 20
