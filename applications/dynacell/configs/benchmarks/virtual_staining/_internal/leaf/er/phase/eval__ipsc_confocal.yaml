# @package _global_
# Phase baseline (no model): the raw Phase3D input scored as the "prediction"
# against the iPSC ER GT. io.pred_is_source reads the manifest source
# channel (Phase3D) and defaults io.pred_path to the GT store. Diffuse organelle:
# supermodel semantic + manifest cell_segmentation_path (no cpdino / instance AP).
defaults:
  - override /target: er_sec61b
  - override /predict_set: ipsc_confocal

io:
  pred_is_source: true

compute_feature_metrics: true

save:
  save_dir: /hpc/projects/virtual_staining/training/dynacell/ipsc/evaluations_with_embeddings/eval_phase_er
