# @package _global_
# Phase baseline (no model): raw Phase3D input scored as the "prediction" against
# the A549 zikv nucleus (H2B) GT. io.pred_is_source reads Phase3D and defaults
# io.pred_path to the GT store (H2B_zikv.ozx), so positions match by construction.
defaults:
  - override /target: nucleus
  - override /predict_set: a549_mantis_h2b_zikv

benchmark:
  dataset_ref:
    target: h2b

io:
  pred_is_source: true

compute_feature_metrics: true
compute_instance_ap: true
segmentation:
  backend: cpdino

save:
  save_dir: /hpc/projects/virtual_staining/training/dynacell/a549/evaluations_with_embeddings/eval_phase_nucleus_zikv
