# @package _global_
# Phase floor for the 2D-benchmark slab3 ER/mito buckets (er_*__2d_focusslab3): the raw
# Phase3D input scored as the "prediction" (io.pred_is_source) on the same focus plane, with
# the same slab3 recipe and plane anchors. It is the no-model reference those focus-plane
# Dice values are compared against; the whole-volume floor stays in the canonical
# evaluations_with_embeddings/eval_phase_* dirs, re-rooted here under /hpc/projects/virtual_staining/training/dynacell/eval_2d_focus_slab3/.
# Generated by applications/dynacell/experiments/2026-10-06_2d-focus-slab3/make_floor_buckets.py.
target_name: er
compute_feature_metrics: false
compute_microssim: false
use_gpu: true
io:
  require_complete_cache: false
pixel_metrics:
  fsc: null
  spectral_pcc: null
focus2d:
  halfwidth: 1
segmentation:
  focus_anchor: nucleus_area
  nuclei_channel_name: Nuclei
runtime:
  executor: serial
  fov_workers: 1
  threads_per_worker: auto
force_recompute:
  final_metrics: true
conditions:
- name: phase__no_model__ipsc
  benchmark:
    dataset_ref:
      dataset: aics-hipsc
      target: sec61b
  io:
    pred_is_source: true
    pred_cache_dir: null
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/eval_2d_focus_slab3/ipsc/evaluations_with_embeddings/eval_phase_er
- name: phase__no_model__a549_mock
  benchmark:
    dataset_ref:
      dataset: a549-mantis-sec61b-mock
      target: sec61b
  io:
    pred_is_source: true
    pred_cache_dir: null
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/eval_2d_focus_slab3/a549/evaluations_with_embeddings/eval_phase_er_mock
  segmentation:
    focus_anchor: phase_midband
- name: phase__no_model__a549_denv
  benchmark:
    dataset_ref:
      dataset: a549-mantis-sec61b-denv
      target: sec61b
  io:
    pred_is_source: true
    pred_cache_dir: null
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/eval_2d_focus_slab3/a549/evaluations_with_embeddings/eval_phase_er_denv
  segmentation:
    focus_anchor: phase_midband
- name: phase__no_model__a549_zikv
  benchmark:
    dataset_ref:
      dataset: a549-mantis-sec61b-zikv
      target: sec61b
  io:
    pred_is_source: true
    pred_cache_dir: null
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/eval_2d_focus_slab3/a549/evaluations_with_embeddings/eval_phase_er_zikv
