# @package _global_
# Narrowed sibling of grouped/er_joint: ONLY the eight fcmae_vscyto3d_{scratch,
# pretrained} joint conditions. Condition blocks are copied byte-identically from
# that leaf -- only the selection is narrowed.
#
# Why: the Phase 18 joint ER fits were re-run to completion (epoch 199/200) and
# re-predicted from their best-by-monitor checkpoints on 2026-08-06, so only these
# eight conditions have new predictions. The other 16 in er_joint are unchanged and
# re-scoring them would be pure cost.
#
# Submit with EVERY pred_* force_recompute flag: a re-predict does not invalidate
# the eval caches by itself (final_metrics alone would rescore stale masks and
# embeddings computed from the OLD predictions). GT-side caches stay warm --
# the ground truth did not change.
target_name: er
compute_feature_metrics: true
use_gpu: true
io:
  require_complete_cache: false
runtime:
  executor: serial
  fov_workers: 1
  threads_per_worker: auto
force_recompute:
  final_metrics: true
conditions:
- name: vscyto3d__joint__a549_denv
  benchmark:
    dataset_ref:
      dataset: a549-mantis-sec61b-denv
      target: sec61b
  io:
    pred_path: /hpc/projects/virtual_staining/training/dynacell/er/fcmae_vscyto3d_pretrained/joint/a549__denv/prediction.zarr
    pred_cache_dir: /hpc/projects/virtual_staining/training/dynacell/a549/eval_cache_pred/er/fcmae_vscyto3d_pretrained/joint/a549__denv
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/er/fcmae_vscyto3d_pretrained/joint/a549__denv
- name: unext2__joint__a549_denv
  benchmark:
    dataset_ref:
      dataset: a549-mantis-sec61b-denv
      target: sec61b
  io:
