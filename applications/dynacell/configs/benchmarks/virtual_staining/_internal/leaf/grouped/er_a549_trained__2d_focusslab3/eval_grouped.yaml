# @package _global_
# 2D benchmark, ER/mito segmentation on the focus plane ("slab3"): the 3 planes centered on
# each FOV's focus plane are segmented as one small volume and only the focus plane of
# the mask is scored (focus2d.halfwidth=1, the 2D-benchmark eval mode). The 3D benchmark keeps
# whole-volume masks in the canonical eval dirs; this bucket never writes there.
#
# Models: the five 2D families from er_a549_trained__2d and the 3D models from er_a549_trained
# (CELL-Diff3D = the iterative sampler only), x the four test sets.
# Plane anchor: nucleus_area on the GT Nuclei channel for the iPSC test set,
# phase_midband (GT Phase3D) for A549, whose SEC61B/TOMM20 stores carry no nuclei.
#
# Output: save_dir = canonical eval dir re-rooted under /hpc/projects/virtual_staining/training/dynacell/eval_2d_focus_slab3/. Only mask_metrics.* are
# the product. Feature metrics, MicroMS3IM, FSC and Spectral PCC are off (pixel_metrics.csv
# holds the other focus-plane pixel metrics); masks are not cached (milliseconds per slab).
# Generated by applications/dynacell/experiments/2026-10-06_2d-focus-slab3/make_buckets.py.
target_name: er
compute_feature_metrics: false
compute_microssim: false
use_gpu: true
io:
  require_complete_cache: false
pixel_metrics:
  fsc: null
  spectral_pcc: null
focus2d:
  halfwidth: 1
segmentation:
  focus_anchor: nucleus_area
  nuclei_channel_name: Nuclei
runtime:
  executor: serial
  fov_workers: 1
  threads_per_worker: auto
force_recompute:
  final_metrics: true
conditions:
- name: celldiff_2d__a549_trained__a549_denv
  benchmark:
    dataset_ref:
      dataset: a549-mantis-sec61b-denv
      target: sec61b
  io:
    pred_path: /hpc/projects/virtual_staining/training/dynacell/er/celldiff_2d/a549/a549__denv/prediction.zarr
    pred_cache_dir: null
  save:
