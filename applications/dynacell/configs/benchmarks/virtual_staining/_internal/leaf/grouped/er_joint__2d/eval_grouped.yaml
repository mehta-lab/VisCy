# @package _global_
# Focused sibling of grouped/er_joint: ONLY the 4 Phase-14 in-focus 2D
# conditions (fnet2d x {ipsc, a549 mock/denv/zikv}). Condition blocks are copied
# verbatim from a generate_grouped_eval_configs.py run, so they stay byte-identical
# to what the canonical bucket would emit -- only the selection is narrowed.
#
# Why a sibling instead of folding fnet2d into the canonical bucket:
#   1. The generator sets force_recompute.final_metrics: true, so the canonical
#      bucket's already-evaluated 3D conditions would ALL recompute, not cache-skip.
#   2. Fairness. The global pixel metrics (PCC/SSIM/FSC/PSNR/Spectral_PCC),
#      MicroMS3IM and the CP regionprops are computed over the FULL 3D volume,
#      while per-cell similarity, the deep features (DINOv3/DynaCLR/CellDINO/
#      MorphEm) and instance AP are focus-restricted (pipeline.py). Only the
#      focus-restricted families are a fair 2D-vs-3D comparison -- a per-z 2D model
#      is penalised by the volume-reconstruction columns for planes it never
#      targeted (2d-infocus-vs-models.md 1a). The full-3D columns are still
#      computed here as diagnostics; they are NOT publishable as 2D-vs-3D.
#
# All 4 conditions are brand new, so nothing is cached and the cold deep-feature
# extraction needs --constraint a100_80|h100_80|h200 (bare a100 matches the 40 GB
# nodes and OOMs).
target_name: er
compute_feature_metrics: true
use_gpu: true
io:
  require_complete_cache: false
runtime:
  executor: serial
  fov_workers: 1
  threads_per_worker: auto
force_recompute:
  final_metrics: true
conditions:
- name: fnet2d__joint__a549_denv
  benchmark:
    dataset_ref:
      dataset: a549-mantis-sec61b-denv
      target: sec61b
  io:
    pred_path: /hpc/projects/virtual_staining/training/dynacell/er/fnet2d/joint/a549__denv/prediction.zarr
    pred_cache_dir: /hpc/projects/virtual_staining/training/dynacell/a549/eval_cache_pred/er/fnet2d/joint/a549__denv
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/er/fnet2d/joint/a549__denv
- name: fnet2d__joint__a549_mock
  benchmark:
    dataset_ref:
      dataset: a549-mantis-sec61b-mock
      target: sec61b
  io:
    pred_path: /hpc/projects/virtual_staining/training/dynacell/er/fnet2d/joint/a549__mock/prediction.zarr
    pred_cache_dir: /hpc/projects/virtual_staining/training/dynacell/a549/eval_cache_pred/er/fnet2d/joint/a549__mock
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/er/fnet2d/joint/a549__mock
- name: fnet2d__joint__a549_zikv
  benchmark:
    dataset_ref:
      dataset: a549-mantis-sec61b-zikv
      target: sec61b
  io:
    pred_path: /hpc/projects/virtual_staining/training/dynacell/er/fnet2d/joint/a549__zikv/prediction.zarr
    pred_cache_dir: /hpc/projects/virtual_staining/training/dynacell/a549/eval_cache_pred/er/fnet2d/joint/a549__zikv
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/er/fnet2d/joint/a549__zikv
- name: fnet2d__joint__ipsc
  benchmark:
    dataset_ref:
      dataset: aics-hipsc
      target: sec61b
  io:
    pred_path: /hpc/projects/virtual_staining/training/dynacell/er/fnet2d/joint/ipsc/prediction.zarr
    pred_cache_dir: /hpc/projects/virtual_staining/training/dynacell/ipsc/eval_cache_pred/er/fnet2d/joint/ipsc
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/er/fnet2d/joint/ipsc
