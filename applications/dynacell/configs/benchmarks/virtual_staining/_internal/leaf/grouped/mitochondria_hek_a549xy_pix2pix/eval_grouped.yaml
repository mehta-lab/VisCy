# @package _global_
# Grouped leaf: pix2pix3d arm of the HEK293T mitochondria (TOMM70A) probe, a549xy
# geometry. Split out of mitochondria_hek_a549xy for the same reason as the
# membrane pair — see membrane_hek_a549xy_pix2pix. Options match the siblings
# exactly so the rows stay comparable.
#
# TWO conditions for now, not three: the iPSC-trained mito GAN was never trained.
# That is a missed submission rather than a structural absence -- its
# train_4gpu_modernized.yml was the only gap in the 12-cell pix2pix (4 organelles x
# 3 pools) grid, and wandb holds A549_TOMM20 and JOINT_TOMM20 fits from 2026-07-07/08
# with no iPSC_TOMM20 run in any state. The backfill fit is in flight (job 35053575);
# add the third condition once it produces a checkpoint and the HEK predict runs.
# Until then the HEK mito table reads pix2pix3d in the A549 and joint pools only.
target_name: mitochondria
compute_feature_metrics: true
use_gpu: true
cross_condition_probe:
  enabled: false
io:
  require_complete_cache: false
runtime:
  executor: serial
  fov_workers: 1
  threads_per_worker: auto
force_recompute:
  final_metrics: true
conditions:
- name: pix2pix3d__a549_trained__hek
  benchmark:
    dataset_ref:
      dataset: hek-mantis-tomm70a-a549xy
      target: tomm70a
  io:
    pred_path: /hpc/projects/virtual_staining/training/dynacell/mito/pix2pix3d_unetvit/a549/hek__a549xy/prediction.zarr
    pred_cache_dir: /hpc/projects/virtual_staining/training/dynacell/hek/eval_cache_pred/mito/pix2pix3d_unetvit/a549/hek__a549xy
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/mito/pix2pix3d_unetvit/a549/hek__a549xy
- name: pix2pix3d__joint__hek
  benchmark:
    dataset_ref:
      dataset: hek-mantis-tomm70a-a549xy
      target: tomm70a
  io:
    pred_path: /hpc/projects/virtual_staining/training/dynacell/mito/pix2pix3d_unetvit/joint/hek__a549xy/prediction.zarr
    pred_cache_dir: /hpc/projects/virtual_staining/training/dynacell/hek/eval_cache_pred/mito/pix2pix3d_unetvit/joint/hek__a549xy
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/mito/pix2pix3d_unetvit/joint/hek__a549xy
