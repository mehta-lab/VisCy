# @package _global_
# Focused sibling of grouped/nucleus_ipsc_trained: ONLY the 8 Phase 15
# patch-vs-augmentation conditions (fnet3d_bigpatch, fnet3d_vscyto3daug x
# {ipsc, a549 mock/denv/zikv}). Condition blocks are copied verbatim from a
# generate_grouped_eval_configs.py run, so they stay byte-identical to what the
# canonical bucket would emit -- only the selection is narrowed.
#
# Why not just run the canonical 38-condition bucket:
#   1. The generator sets force_recompute.final_metrics: true, so the 26 already-
#      evaluated conditions would NOT cache-skip -- they would all recompute.
#   2. Regenerating the canonical leaves also folds in 4 `fnet2d` conditions per
#      bucket. The 2D track is supposed to be reported only on focus-restricted
#      metrics (a per-z 2D model is penalised for planes it never targeted by the
#      full-3D volume-reconstruction metrics), so scoring it here would manufacture
#      numbers that must not be published. That folding is a researcher decision,
#      not a side effect of the Phase 15 predicts.
#
# All 8 conditions are brand new, so nothing is cached and the cold deep-feature
# extraction needs --constraint a100_80|h100_80|h200 (bare a100 matches the 40 GB
# nodes and OOMs).
target_name: nucleus
compute_feature_metrics: true
use_gpu: true
io:
  require_complete_cache: false
runtime:
  executor: serial
  fov_workers: 1
  threads_per_worker: auto
force_recompute:
  final_metrics: true
compute_instance_ap: true
segmentation:
  backend: cpdino
conditions:
- name: fnet3d_bigpatch__ipsc_trained__a549_denv
  benchmark:
    dataset_ref:
      dataset: a549-mantis-h2b-denv
      target: h2b
  io:
    pred_path: /hpc/projects/virtual_staining/training/dynacell/nucleus/fnet3d_bigpatch/ipsc/a549__denv/prediction.zarr
    pred_cache_dir: /hpc/projects/virtual_staining/training/dynacell/a549/eval_cache_pred/nucleus/fnet3d_bigpatch/ipsc/a549__denv
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/nucleus/fnet3d_bigpatch/ipsc/a549__denv
- name: fnet3d_vscyto3daug__ipsc_trained__a549_denv
