# @package _global_
# Grouped probe leaf: er bucket, 6 conditions covering every code path. All save_dirs/pred_cache_dirs under /tmp/reeval_probe/ so partial runs cannot corrupt production data. Used by Step 5 of the campaign.
target_name: er
compute_feature_metrics: true
use_gpu: true
io:
  require_complete_cache: false
runtime:
  executor: serial
  fov_workers: 1
  threads_per_worker: auto
force_recompute:
  final_metrics: true
conditions:
- name: celldiff_r2__a549_trained__a549_denv
  benchmark:
    dataset_ref:
      dataset: a549-mantis-sec61b-denv
      target: sec61b
  io:
    pred_path: /hpc/projects/virtual_staining/training/dynacell/er/celldiff_r2/a549/a549__denv/prediction.zarr
    pred_cache_dir: /tmp/reeval_probe/cache/celldiff_r2__a549_trained__a549_denv
  save:
    save_dir: /tmp/reeval_probe/out/celldiff_r2__a549_trained__a549_denv
- name: celldiff_r2__a549_trained__ipsc
