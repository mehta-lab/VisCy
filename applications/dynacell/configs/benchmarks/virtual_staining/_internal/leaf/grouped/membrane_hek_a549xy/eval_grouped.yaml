# @package _global_
# Grouped leaf: HEK293T membrane (KRAS) third-cell-type probe, a549xy geometry.
# NeurIPS response item O — the cell-type axis at fixed instrument (both HEK and
# A549 are mantis; iPSC is confocal), so a drop here that A549 does not show is
# cell type rather than microscope.
#
# Hand-written, NOT emitted by tools/generate_grouped_eval_configs.py: that
# generator buckets by (organelle, train_set) with no test-set axis, so it cannot
# express a HEK bucket, and re-running it would rewrite the twelve committed
# ipsc/a549 buckets with the in-flight 2D campaign's fnet2d conditions.
#
# Six model conditions: the paper's regression pair (FNet3D, VSCyto3D) x three
# training pools. CELL-Diff lives in the sibling membrane_hek_a549xy_celldiff
# leaf — its predicts are ~25x slower, and splitting keeps this bucket off that
# tail while both share one warm GT cache.
#
# Deliberate departures from the ipsc/a549 membrane buckets:
#   * compute_instance_ap: false and no cpdino backend. Whole-cell instance AP
#     needs a GT nucleus channel to carve (segmentation.nuclei_channel_name);
#     the HEK release ships none, and its nucleus target failed QC.
#
#     CONSEQUENCE, and it is not cosmetic: compute_instance_ap IS pipeline.py's
#     ``instance_mode``, and that flag also switches what Dice/IoU/Precision/
#     Recall are computed ON. With it true (the ipsc/a549 membrane buckets) they
#     are the overlap of binarized carved cpdino WHOLE-CELL labels -- filled
#     cells, ~30-50% foreground, Dice ~0.85. With it false (here) they are the
#     overlap of SuperModel semantic membrane masks -- thin shells at ~2-5%
#     foreground, where a 1-2 voxel displacement alone drops Dice near zero.
#     So this bucket's Dice is NOT comparable to the membrane Dice in the paper's
#     tables, and must never be placed beside it as a cross-cell-type delta. The
#     mito bucket has no such problem: mito is never instance_mode, so both HEK
#     and A549/iPSC score the same classical Workflow_tomm20 masks.
#   * cross_condition_probe disabled: it classifies infected-vs-mock, and HEK
#     has a single (uninfected) condition. It is default-on whenever feature
#     metrics run, and would otherwise log a skip every time.
#
# io.gt_path / gt_channel_name / cell_segmentation_path / gt_cache_dir and
# pixel_metrics.spacing all come from the manifest via benchmark.dataset_ref.
# focus.* is left at the eval.yaml defaults ON PURPOSE: lambda_ill 0.450 is what
# the HEK stores' focus_slice zattrs were written with, and focus.estimator_sig
# is hashed into every deep-feature preprocess_version, so raising it to the
# acquisition's 0.5 would silently discard all four prewarmed embedding caches.
target_name: membrane
compute_feature_metrics: true
use_gpu: true
compute_instance_ap: false
cross_condition_probe:
  enabled: false
io:
  require_complete_cache: false
runtime:
  executor: serial
  fov_workers: 1
  threads_per_worker: auto
force_recompute:
  final_metrics: true
conditions:
- name: fnet3d__ipsc_trained__hek
  benchmark:
    dataset_ref:
      dataset: hek-mantis-kras-a549xy
      target: kras
  io:
    pred_path: /hpc/projects/virtual_staining/training/dynacell/membrane/fnet3d_paper/ipsc/hek__a549xy/prediction.zarr
    pred_cache_dir: /hpc/projects/virtual_staining/training/dynacell/hek/eval_cache_pred/membrane/fnet3d_paper/ipsc/hek__a549xy
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/membrane/fnet3d_paper/ipsc/hek__a549xy
- name: fnet3d__a549_trained__hek
  benchmark:
    dataset_ref:
      dataset: hek-mantis-kras-a549xy
      target: kras
  io:
    pred_path: /hpc/projects/virtual_staining/training/dynacell/membrane/fnet3d_paper/a549/hek__a549xy/prediction.zarr
    pred_cache_dir: /hpc/projects/virtual_staining/training/dynacell/hek/eval_cache_pred/membrane/fnet3d_paper/a549/hek__a549xy
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/membrane/fnet3d_paper/a549/hek__a549xy
- name: fnet3d__joint__hek
  benchmark:
    dataset_ref:
      dataset: hek-mantis-kras-a549xy
      target: kras
  io:
    pred_path: /hpc/projects/virtual_staining/training/dynacell/membrane/fnet3d_paper/joint/hek__a549xy/prediction.zarr
    pred_cache_dir: /hpc/projects/virtual_staining/training/dynacell/hek/eval_cache_pred/membrane/fnet3d_paper/joint/hek__a549xy
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/membrane/fnet3d_paper/joint/hek__a549xy
- name: vscyto3d__ipsc_trained__hek
  benchmark:
    dataset_ref:
      dataset: hek-mantis-kras-a549xy
      target: kras
  io:
    pred_path: /hpc/projects/virtual_staining/training/dynacell/membrane/fcmae_vscyto3d_pretrained/ipsc/hek__a549xy/prediction.zarr
    pred_cache_dir: /hpc/projects/virtual_staining/training/dynacell/hek/eval_cache_pred/membrane/fcmae_vscyto3d_pretrained/ipsc/hek__a549xy
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/membrane/fcmae_vscyto3d_pretrained/ipsc/hek__a549xy
- name: vscyto3d__a549_trained__hek
  benchmark:
    dataset_ref:
      dataset: hek-mantis-kras-a549xy
      target: kras
  io:
    pred_path: /hpc/projects/virtual_staining/training/dynacell/membrane/fcmae_vscyto3d_pretrained/a549/hek__a549xy/prediction.zarr
    pred_cache_dir: /hpc/projects/virtual_staining/training/dynacell/hek/eval_cache_pred/membrane/fcmae_vscyto3d_pretrained/a549/hek__a549xy
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/membrane/fcmae_vscyto3d_pretrained/a549/hek__a549xy
- name: vscyto3d__joint__hek
  benchmark:
    dataset_ref:
      dataset: hek-mantis-kras-a549xy
      target: kras
  io:
    pred_path: /hpc/projects/virtual_staining/training/dynacell/membrane/fcmae_vscyto3d_pretrained/joint/hek__a549xy/prediction.zarr
    pred_cache_dir: /hpc/projects/virtual_staining/training/dynacell/hek/eval_cache_pred/membrane/fcmae_vscyto3d_pretrained/joint/hek__a549xy
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/membrane/fcmae_vscyto3d_pretrained/joint/hek__a549xy
# No-model floor, last so a failure here cannot cost the six model rows. Sets no
# pred_path: io.pred_is_source makes _ref_hook read the manifest source channel
# (Phase3D) as the prediction and default pred_path to the GT store, so positions
# match by construction. Matches the mito/er phase leaves (no pred_cache_dir).
- name: phase__no_model__hek
  benchmark:
    dataset_ref:
      dataset: hek-mantis-kras-a549xy
      target: kras
  io:
    pred_is_source: true
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/hek/evaluations_with_embeddings/eval_phase_membrane_a549xy
