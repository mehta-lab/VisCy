# @package _global_
# 2D benchmark (focus2d.halfwidth=1): every metric on one GT-anchored focus plane per
# FOV/timepoint -- pixel metrics, MicroMS3IM and CP on the plane, deep features and per-cell
# similarity on its 3-plane slab, whole-cell instance masks (cpdino) on the slab MIP. The 3D
# benchmark keeps the full volume in the canonical dirs; this bucket never writes there
# (save_dir re-rooted under
# /hpc/projects/virtual_staining/training/dynacell/eval_focus2d_h1/). Phase floor: the raw
# Phase3D input scored as the prediction (io.pred_is_source) on the same planes. Plane anchor:
# nucleus_area on the GT Nuclei channel (iPSC and A549). Caches: <cache_dir>/focus2d_h1/ (GT
# and pred); CP reference <target>__focus2d_h1. Generated by
# applications/dynacell/experiments/2026-10-07_2d-vs-3d-cost/make_focus2d_buckets.py.
target_name: membrane
compute_feature_metrics: true
use_gpu: true
io:
  require_complete_cache: false
runtime:
  executor: serial
  fov_workers: 1
  threads_per_worker: auto
force_recompute:
  final_metrics: true
compute_instance_ap: true
segmentation:
  backend: cpdino
  nuclei_channel_name: Nuclei
focus2d:
  halfwidth: 1
conditions:
- name: phase__no_model__a549_denv
  benchmark:
    dataset_ref:
      dataset: a549-mantis-caax-denv
      target: caax
  io:
    nuclei_gt_path: /hpc/projects/virtual_staining/training/dynacell/a549/mantis/test/dual_nucl_memb_DENV.zarr
    pred_is_source: true
    pred_cache_dir: null
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/eval_focus2d_h1/a549/evaluations_with_embeddings/eval_phase_membrane_denv
- name: phase__no_model__a549_mock
  benchmark:
    dataset_ref:
      dataset: a549-mantis-caax-mock
      target: caax
  io:
    nuclei_gt_path: /hpc/projects/virtual_staining/training/dynacell/a549/mantis/test/dual_nucl_memb_mock.zarr
    pred_is_source: true
    pred_cache_dir: null
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/eval_focus2d_h1/a549/evaluations_with_embeddings/eval_phase_membrane_mock
- name: phase__no_model__a549_zikv
  benchmark:
    dataset_ref:
      dataset: a549-mantis-caax-zikv
      target: caax
  io:
    nuclei_gt_path: /hpc/projects/virtual_staining/training/dynacell/a549/mantis/test/dual_nucl_memb_ZIKV.zarr
    pred_is_source: true
    pred_cache_dir: null
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/eval_focus2d_h1/a549/evaluations_with_embeddings/eval_phase_membrane_zikv
- name: phase__no_model__ipsc
  benchmark:
    dataset_ref:
      dataset: aics-hipsc
      target: membrane
  io:
    pred_is_source: true
    pred_cache_dir: null
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/eval_focus2d_h1/ipsc/evaluations_with_embeddings/eval_phase_membrane
