# @package _global_
# Grouped leaf: CELL-Diff arm of the HEK293T mitochondria (TOMM70A) probe, a549xy
# geometry. Split out of mitochondria_hek_a549xy for the same reason as the
# membrane pair — see membrane_hek_a549xy_celldiff. Options match the sibling
# exactly so the rows stay comparable.
target_name: mitochondria
compute_feature_metrics: true
use_gpu: true
cross_condition_probe:
  enabled: false
io:
  require_complete_cache: false
runtime:
  executor: serial
  fov_workers: 1
  threads_per_worker: auto
force_recompute:
  final_metrics: true
conditions:
- name: celldiff_r2__ipsc_trained__hek
  benchmark:
    dataset_ref:
      dataset: hek-mantis-tomm70a-a549xy
      target: tomm70a
  io:
    pred_path: /hpc/projects/virtual_staining/training/dynacell/mito/celldiff_r2_iterative/ipsc/hek__a549xy/prediction.zarr
    pred_cache_dir: /hpc/projects/virtual_staining/training/dynacell/hek/eval_cache_pred/mito/celldiff_r2_iterative/ipsc/hek__a549xy
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/mito/celldiff_r2_iterative/ipsc/hek__a549xy
- name: celldiff_r2__a549_trained__hek
  benchmark:
    dataset_ref:
      dataset: hek-mantis-tomm70a-a549xy
      target: tomm70a
  io:
    pred_path: /hpc/projects/virtual_staining/training/dynacell/mito/celldiff_r2/a549/hek__a549xy/prediction.zarr
    pred_cache_dir: /hpc/projects/virtual_staining/training/dynacell/hek/eval_cache_pred/mito/celldiff_r2/a549/hek__a549xy
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/mito/celldiff_r2/a549/hek__a549xy
- name: celldiff_r2__joint__hek
  benchmark:
    dataset_ref:
      dataset: hek-mantis-tomm70a-a549xy
      target: tomm70a
  io:
    pred_path: /hpc/projects/virtual_staining/training/dynacell/mito/celldiff_r2/joint/hek__a549xy/prediction.zarr
    pred_cache_dir: /hpc/projects/virtual_staining/training/dynacell/hek/eval_cache_pred/mito/celldiff_r2/joint/hek__a549xy
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/mito/celldiff_r2/joint/hek__a549xy
