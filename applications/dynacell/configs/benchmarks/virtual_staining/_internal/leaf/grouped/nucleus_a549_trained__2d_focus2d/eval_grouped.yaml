# @package _global_
# 2D benchmark (focus2d.halfwidth=1): every metric on one GT-anchored focus plane per
# FOV/timepoint -- pixel metrics, MicroMS3IM and CP on the plane, deep features and per-cell
# similarity on its 3-plane slab, instance masks (cpdino) on the slab MIP. The 3D benchmark
# keeps the full volume in the canonical dirs; this bucket never writes there (save_dir re-
# rooted under /hpc/projects/virtual_staining/training/dynacell/eval_focus2d_h1/). Conditions:
# the 20 of nucleus_a549_trained__2d (5 2D families x 4 test sets), predictions unchanged.
# Plane anchor: nucleus_area on the GT nucleus target (iPSC and A549). Caches:
# <cache_dir>/focus2d_h1/ (GT and pred); CP reference <target>__focus2d_h1. Generated by
# applications/dynacell/experiments/2026-10-07_2d-vs-3d-cost/make_focus2d_buckets.py.
target_name: nucleus
compute_feature_metrics: true
use_gpu: true
io:
  require_complete_cache: false
runtime:
  executor: serial
  fov_workers: 1
  threads_per_worker: auto
force_recompute:
  final_metrics: true
  pred_masks: true
  pred_cp: true
  pred_dinov3: true
  pred_dynaclr: true
  pred_celldino: true
  pred_morphem: true
  pred_instances: true
compute_instance_ap: true
segmentation:
  backend: cpdino
focus2d:
  halfwidth: 1
conditions:
- name: celldiff_2d__a549_trained__a549_denv
  benchmark:
    dataset_ref:
      dataset: a549-mantis-h2b-denv
      target: h2b
  io:
    pred_path: /hpc/projects/virtual_staining/training/dynacell/nucleus/celldiff_2d/a549/a549__denv/prediction.zarr
    pred_cache_dir: /hpc/projects/virtual_staining/training/dynacell/a549/eval_cache_pred/nucleus/celldiff_2d/a549/a549__denv
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/eval_focus2d_h1/nucleus/celldiff_2d/a549/a549__denv
- name: vscyto2d__a549_trained__a549_denv
