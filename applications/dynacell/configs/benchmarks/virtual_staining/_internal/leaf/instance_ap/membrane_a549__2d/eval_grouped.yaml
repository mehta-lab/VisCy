# @package _global_
# Filtered instance-AP leaf: membrane x a549 test, fnet2d ONLY (9 conditions, slice_fraction=0.3).
# Sibling of instance_ap/membrane_a549/, NOT a fold into it: that leaf carries
# force_recompute.final_metrics=true, so regenerating it would recompute all of its
# already-evaluated conditions. save_dir is per condition, so results land in the same
# place either way. Blocks generated by tools/generate_instance_ap_eval_configs.py
# build_leaf() -- byte-identical to the canonical bucket's; do not hand-edit.
target_name: membrane
compute_instance_ap: true
compute_feature_metrics: false
compute_microssim: false
use_gpu: true
segmentation:
  backend: cpdino
  slice_fraction: 0.3
  nuclei_channel_name: Nuclei
io:
  require_complete_cache: false
runtime:
  executor: serial
  fov_workers: 1
  threads_per_worker: auto
force_recompute:
  final_metrics: true
conditions:
- name: fnet2d__a549_trained__a549_denv
  benchmark:
    dataset_ref:
      dataset: a549-mantis-caax-denv
      target: caax
  io:
    pred_path: /hpc/projects/virtual_staining/training/dynacell/membrane/fnet2d/a549/a549__denv/prediction.zarr
    pred_cache_dir: /hpc/projects/virtual_staining/training/dynacell/a549/eval_cache_pred_instance_ap/membrane/fnet2d/a549/a549__denv
    nuclei_gt_path: /hpc/projects/virtual_staining/training/dynacell/a549/mantis/test/dual_nucl_memb_DENV.zarr
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/membrane/fnet2d/a549/a549__denv/instance_ap
- name: fnet2d__a549_trained__a549_mock
  benchmark:
    dataset_ref:
      dataset: a549-mantis-caax-mock
      target: caax
  io:
