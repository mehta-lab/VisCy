# @package _global_
# Filtered instance-AP leaf: nucleus x ipsc test, fnet2d ONLY (3 conditions, slice_fraction=0.5).
# Sibling of instance_ap/nucleus_ipsc/, NOT a fold into it: that leaf carries
# force_recompute.final_metrics=true, so regenerating it would recompute all of its
# already-evaluated conditions. save_dir is per condition, so results land in the same
# place either way. Blocks generated by tools/generate_instance_ap_eval_configs.py
# build_leaf() -- byte-identical to the canonical bucket's; do not hand-edit.
target_name: nucleus
compute_instance_ap: true
compute_feature_metrics: false
compute_microssim: false
use_gpu: true
segmentation:
  backend: cpdino
  slice_fraction: 0.5
io:
  require_complete_cache: false
runtime:
  executor: serial
  fov_workers: 1
  threads_per_worker: auto
force_recompute:
  final_metrics: true
conditions:
- name: fnet2d__a549_trained__ipsc
  benchmark:
    dataset_ref:
      dataset: aics-hipsc
      target: nucleus
  io:
    pred_path: /hpc/projects/virtual_staining/training/dynacell/nucleus/fnet2d/a549/ipsc/prediction.zarr
    pred_cache_dir: /hpc/projects/virtual_staining/training/dynacell/ipsc/eval_cache_pred_instance_ap/nucleus/fnet2d/a549/ipsc
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/nucleus/fnet2d/a549/ipsc/instance_ap
- name: fnet2d__ipsc_trained__ipsc
  benchmark:
    dataset_ref:
      dataset: aics-hipsc
      target: nucleus
  io:
    pred_path: /hpc/projects/virtual_staining/training/dynacell/nucleus/fnet2d/ipsc/ipsc/prediction.zarr
    pred_cache_dir: /hpc/projects/virtual_staining/training/dynacell/ipsc/eval_cache_pred_instance_ap/nucleus/fnet2d/ipsc/ipsc
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/nucleus/fnet2d/ipsc/ipsc/instance_ap
- name: fnet2d__joint__ipsc
  benchmark:
    dataset_ref:
      dataset: aics-hipsc
      target: nucleus
  io:
    pred_path: /hpc/projects/virtual_staining/training/dynacell/nucleus/fnet2d/joint/ipsc/prediction.zarr
    pred_cache_dir: /hpc/projects/virtual_staining/training/dynacell/ipsc/eval_cache_pred_instance_ap/nucleus/fnet2d/joint/ipsc
  save:
    save_dir: /hpc/projects/virtual_staining/training/dynacell/nucleus/fnet2d/joint/ipsc/instance_ap
