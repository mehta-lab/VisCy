# pix2pix2d `wmatch` arm (fit) of mito/pix2pix2d_unetvit/a549_mantis/train.yml.
# Recipe delta: warmup_steps 8500 -> 1177. Run-D's 8500-batch warmup is
# 27.0 % of the matching 3D fit (31480 batches); this 2D fit runs 4360, so
# round(8500 * 4360 / 31480) keeps the same schedule shape. The baseline's absolute 8500
# left 5 of 12 2D fits still warming up at their last step (wandb lr-AdamW, 2026-10-22).
# Everything else, and the rationale for it, is the baseline leaf's.
# Written by applications/dynacell/experiments/2026-10-22_2d-benchmark-paper-appendix/make_wmatch_fit_leaves.py.
base:
- ../../../_internal/shared/model/train_sets/a549_mantis.yml
- ../../../_internal/shared/model/targets/mito_tomm20.yml
- ../../../_internal/shared/model/data_overlays/pix2pix2d_unetvit_fit.yml
- ../../../_internal/shared/model/model_overlays/pix2pix2d_unetvit_fit.yml
- ../../../_internal/shared/model/launcher_profiles/mode_fit.yml
- ../../../_internal/shared/model/launcher_profiles/hardware_4gpu.yml
- ../../../_internal/shared/model/launcher_profiles/runtime_shared.yml
benchmark:
  task: virtual_staining
  organelle: mito
  gene: TOMM20
  target: mito
  target_id: mito
  train_set: a549_mantis
  model_name: pix2pix2d_unetvit_wmatch
  experiment_id: mito__a549_mantis__pix2pix2d_unetvit_wmatch
  dataset_ref: null
data:
  init_args:
    source_channel: Phase3D
    target_channel: Structure
    data_path: /hpc/projects/virtual_staining/training/dynacell/a549/mantis/train/TOMM20_all_focus.zarr
    augmentations:
    - class_path: viscy_transforms.RandWeightedCropd
      init_args:
        keys:
        - Phase3D
        - Structure
        w_key: Structure
        spatial_size:
        - 1
        - 624
        - 624
        num_samples: 2
trainer:
  logger:
    init_args:
      name: pix2pix2d_unetvit_wmatch_A549_TOMM20
      save_dir: /hpc/projects/comp.micro/virtual_staining/models/dynacell/a549/mito/pix2pix2d_unetvit_wmatch
  callbacks:
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: step
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      monitor: loss/validate_ema
      filename: epoch={epoch}-step={step}-loss={loss/validate_ema:.3f}
      auto_insert_metric_name: false
      every_n_epochs: 1
      save_top_k: 4
      save_last: true
      dirpath: /hpc/projects/comp.micro/virtual_staining/models/dynacell/a549/mito/pix2pix2d_unetvit_wmatch/checkpoints
launcher:
  job_name: pix2pix2d_unetvit_wmatch_A549_TOMM20
  run_root: /hpc/projects/comp.micro/virtual_staining/models/dynacell/a549/mito/pix2pix2d_unetvit_wmatch
  sbatch:
    constraint: a40|a6000|l40s|h100|h200
    mem: 128G
model:
  init_args:
    warmup_steps: 1177
