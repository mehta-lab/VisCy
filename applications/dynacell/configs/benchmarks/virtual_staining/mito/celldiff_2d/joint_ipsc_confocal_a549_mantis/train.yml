# CellDiff-2D (CELLDiffNet run Z-preserving at Z=1) fit on mito (Structure)
# — joint ipsc_confocal + a549_mantis pooled, in-focus 2D track. Mirror of
# the 3D mito/celldiff/joint_* fit leaf, flattened onto the offline
# 5-plane in-focus slab stores.
#
# BatchedConcatDataModule + two explicit HCSDataModule children; only
# model_overlays/celldiff_2d_fit.yml is composed (the data block is
# authored inline here, not via data_overlays).
#
# batch_size 2 here, NOT the single-set 4: BatchedConcatDataModule's
# train_dataloader uses batch_size as-is, while HCSDataModule divides by
# RandWeightedCropd num_samples. 2 indices * 2 num_samples = 4 GPU
# samples, matching the single-set leaves.
base:
  - ../../../_internal/shared/model/model_overlays/celldiff_2d_fit.yml
  - ../../../_internal/shared/model/launcher_profiles/mode_fit.yml
  - ../../../_internal/shared/model/launcher_profiles/hardware_gpu_any_long.yml
  - ../../../_internal/shared/model/launcher_profiles/runtime_shared.yml

benchmark:
  task: virtual_staining
  organelle: mito
  gene: TOMM20
  target: mito
  target_id: mito
  train_set: joint_ipsc_confocal_a549_mantis
  model_name: celldiff_2d
  experiment_id: mito__joint_ipsc_confocal_a549_mantis__celldiff_2d

trainer:
  logger:
    init_args:
      name: CELLDiff2D_JOINT_TOMM20
      save_dir: /hpc/projects/comp.micro/virtual_staining/models/dynacell/joint/mito/celldiff_2d
  callbacks:
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        every_n_epochs: 1
        save_top_k: -1
        save_last: true
        dirpath: /hpc/projects/comp.micro/virtual_staining/models/dynacell/joint/mito/celldiff_2d/checkpoints

_hcs_init_args: &hcs_init_args
  source_channel: Phase3D
  target_channel: Structure
  z_window_size: 1
  batch_size: 2
  num_workers: 4
  yx_patch_size: [512, 512]
  split_ratio: 0.8
  mmap_preload: true
  scratch_dir: /dev/shm
  persistent_workers: true
  normalizations:
    - class_path: viscy_transforms.MinMaxSampled
      init_args:
        keys: [Phase3D]
        level: timepoint_statistics
    - class_path: viscy_transforms.MinMaxSampled
      init_args:
        keys: [Structure]
        level: timepoint_statistics
  augmentations:
    - class_path: viscy_transforms.RandWeightedCropd
      init_args:
        keys: [Phase3D, Structure]
        w_key: Structure
        spatial_size: [1, 624, 624]
        num_samples: 2
  gpu_augmentations:
    - class_path: viscy_transforms.BatchedRandAffined
      init_args:
        keys: [source, target]
        prob: 0.8
        rotate_range: [0, 0, 0]
        shear_range: [0.0, 0.05, 0.05]
        scale_range: [[1, 1], [0.5, 1.5], [0.5, 1.5]]
        safe_crop_size: [1, 512, 512]
        safe_crop_coverage: 0.9
    - class_path: viscy_transforms.BatchedCenterSpatialCropd
      init_args:
        keys: [source, target]
        roi_size: [1, 512, 512]
    - class_path: viscy_transforms.BatchedRandAdjustContrastd
      init_args:
        keys: [source]
        prob: 0.5
        gamma: [0.8, 1.2]
    - class_path: viscy_transforms.BatchedRandScaleIntensityd
      init_args:
        keys: [source]
        prob: 0.5
        factors: 0.5
    - class_path: viscy_transforms.BatchedRandGaussianNoised
      init_args:
        keys: [source]
        prob: 0.5
        mean: 0.0
        std: 0.3
    - class_path: viscy_transforms.BatchedRandGaussianSmoothd
      init_args:
        keys: [source]
        prob: 0.5
        sigma_x: [0.25, 0.75]
        sigma_y: [0.25, 0.75]
        sigma_z: [0, 0]
  val_gpu_augmentations:
    - class_path: viscy_transforms.BatchedCenterSpatialCropd
      init_args:
        keys: [source, target]
        roi_size: [1, 512, 512]


data:
  class_path: viscy_data.BatchedConcatDataModule
  init_args:
    data_modules:
      # ipsc_confocal — aics-hipsc TOMM20 in-focus slab store
      - class_path: viscy_data.hcs.HCSDataModule
        init_args:
          <<: *hcs_init_args
          data_path: /hpc/projects/virtual_staining/training/dynacell/ipsc/dataset_v4/train/TOMM20_focus.zarr
      # a549_mantis — pooled TOMM20 all-conditions in-focus slab store
      - class_path: viscy_data.hcs.HCSDataModule
        init_args:
          <<: *hcs_init_args
          data_path: /hpc/projects/virtual_staining/training/dynacell/a549/mantis/train/TOMM20_all_focus.zarr

launcher:
  job_name: CELLDiff2D_JOINT_TOMM20
  run_root: /hpc/projects/comp.micro/virtual_staining/models/dynacell/joint/mito/celldiff_2d
  # 128G: both children preload 5-plane in-focus slabs (~1/4 the Z of the
  # 3D stores), so the 512G the 3D joint leaf needed is wasteful here.
  sbatch:
    mem: "128G"
