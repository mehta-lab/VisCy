# celldiff predict: mito trained on ipsc_confocal,
# predicting against the HEK293T third-cell-type probe (TOMM70A, a549xy geometry).
# Auto-generated by tools/generate_hek_predict_configs.py from
# mito/celldiff/ipsc_confocal/predict__a549_mantis_mock.yml — checkpoint lifted verbatim.
# Fit verified to train against a raw (non-deconvolved) GT channel.
# Evaluation-only: no HEK training. Path token is 'celldiff_r2_iterative' (config dir 'celldiff').
base:
- ../../../_internal/shared/model/predict_sets/hek_mantis_tomm70a_a549xy.yml
- ../../../_internal/shared/model/targets/mito_tomm20.yml
- ../../../_internal/shared/model/model_overlays/celldiff_predict.yml
- ../../../_internal/shared/model/launcher_profiles/mode_predict.yml
- ../../../_internal/shared/model/launcher_profiles/hardware_predict_any_gpu.yml
- ../../../_internal/shared/model/launcher_profiles/runtime_shared.yml
benchmark:
  task: virtual_staining
  organelle: mito
  trained_on: ipsc_confocal
  predict_set: hek_mantis_tomm70a_a549xy
  model_name: celldiff
  experiment_id: mito__ipsc_confocal__celldiff__hek_mantis_tomm70a_a549xy
  dataset_ref:
    target: tomm70a
model:
  init_args:
    ckpt_path: /hpc/projects/comp.micro/virtual_staining/models/dynacell/ipsc/mito/celldiff_r2/checkpoints/epoch=19-step=128000.ckpt
data:
  init_args:
    normalizations:
    - class_path: viscy_transforms.NormalizeSampled
      init_args:
        keys:
        - Phase3D
        level: fov_statistics
        subtrahend: mean
        divisor: std
    augmentations: []
trainer:
  callbacks:
  - class_path: viscy_utils.callbacks.prediction_writer.HCSPredictionWriter
    init_args:
      output_store: /hpc/projects/virtual_staining/training/dynacell/mito/celldiff_r2_iterative/ipsc/hek__a549xy/prediction.zarr
launcher:
  job_name: CELLDIFF_PRED_MITO_IPSCTR_HEK
  run_root: /hpc/projects/virtual_staining/training/dynacell/mito/celldiff_r2_iterative/ipsc/hek__a549xy
  sbatch:
    constraint: a40|l40s|a6000|a100|h100|h200
