# CellDiff r2 predict: mito (TOMM20) trained on A549 mantis, predicting against a549_mantis_tomm20_zikv test.
base:
  - ../../../_internal/shared/model/predict_sets/a549_mantis_tomm20_zikv.yml
  - ../../../_internal/shared/model/targets/mito_tomm20.yml
  - ../../../_internal/shared/model/model_overlays/celldiff_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/mode_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/hardware_predict_any_gpu.yml
  - ../../../_internal/shared/model/launcher_profiles/runtime_shared.yml

benchmark:
  task: virtual_staining
  organelle: mito
  trained_on: a549_mantis
  predict_set: a549_mantis_tomm20_zikv
  model_name: celldiff
  experiment_id: mito__a549_mantis__celldiff__a549_mantis_tomm20_zikv

model:
  init_args:
    ckpt_path: /hpc/projects/comp.micro/virtual_staining/models/dynacell/a549/mito/celldiff_r2/checkpoints/epoch=19-step=64800-v1.ckpt
    predict_method: iterative
    predict_overlap: [4, 256, 256]

data:
  init_args:
    normalizations:
      - class_path: viscy_transforms.MinMaxSampled
        init_args:
          keys: [Phase3D]
          level: timepoint_statistics
    augmentations: []
    z_window_size: 48

trainer:
  callbacks:
    - class_path: viscy_utils.callbacks.prediction_writer.HCSPredictionWriter
      init_args:
        output_store: /hpc/projects/virtual_staining/training/dynacell/mito/celldiff_r2/a549/a549__zikv/prediction.zarr

launcher:
  job_name: CELLDiff_A549_PRED_TOMM20_ZIKV
  run_root: /hpc/projects/virtual_staining/training/dynacell/mito/celldiff_r2/a549/a549__zikv
