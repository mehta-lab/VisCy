# FNet3DVSAug predict template (mito, TOMM20): trained on iPSC, predicting ipsc_confocal.
# ckpt_path is a placeholder; the Spotlight-v2 arms predict with --ckpt best.
base:
  - ../../../_internal/shared/model/predict_sets/ipsc_confocal.yml
  - ../../../_internal/shared/model/targets/mito_tomm20.yml
  - ../../../_internal/shared/model/model_overlays/fnet3d_paper_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/mode_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/hardware_predict_any_gpu.yml
  - ../../../_internal/shared/model/launcher_profiles/runtime_shared.yml

benchmark:
  task: virtual_staining
  organelle: mito
  trained_on: ipsc_confocal
  predict_set: ipsc_confocal
  model_name: fnet3d_vscyto3daug
  experiment_id: mito__ipsc_confocal__fnet3d_vscyto3daug__ipsc_confocal

model:
  init_args:
    ckpt_path: /hpc/projects/comp.micro/virtual_staining/models/dynacell/ipsc/mito/fnet3d_vscyto3daug/checkpoints/last.ckpt

data:
  init_args:
    normalizations:
      - class_path: viscy_transforms.NormalizeSampled
        init_args:
          keys: [Phase3D]
          level: fov_statistics
          subtrahend: mean
          divisor: std
    augmentations: []

trainer:
  callbacks:
    - class_path: viscy_utils.callbacks.prediction_writer.HCSPredictionWriter
      init_args:
        output_store: /hpc/projects/virtual_staining/training/dynacell/mito/fnet3d_vscyto3daug/ipsc/ipsc/prediction.zarr

launcher:
  job_name: FNet3DVSAug_PRED_TOMM20
  run_root: /hpc/projects/virtual_staining/training/dynacell/mito/fnet3d_vscyto3daug/ipsc/ipsc
