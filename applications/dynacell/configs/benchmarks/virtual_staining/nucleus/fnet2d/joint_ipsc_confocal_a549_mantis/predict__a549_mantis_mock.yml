# FNet2D predict: nucleus (NUCL) trained on joint_ipsc_confocal_a549_mantis, tested on A549 mantis mock.
# In-focus 2D track (Phase F). The 2D checkpoint predicts over the FULL-Z 3D test
# store with z_window_size=1 (fnet2d_predict overlay), emitting one window per
# z-plane -> a full-Z prediction store the existing focus-aware eval consumes
# unchanged. Source normalization (Phase3D fov_statistics mean/std) reproduces the
# fnet2d fit overlay exactly; a mismatch here would silently degrade predictions.
# Best val-loss checkpoint: epoch=339-step=181220-loss=1.220.ckpt (loss/validate=1.220).
base:
  - ../../../_internal/shared/model/predict_sets/a549_mantis_h2b_mock.yml
  - ../../../_internal/shared/model/targets/nucleus.yml
  - ../../../_internal/shared/model/model_overlays/fnet2d_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/mode_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/hardware_predict_any_gpu.yml
  - ../../../_internal/shared/model/launcher_profiles/runtime_shared.yml

benchmark:
  task: virtual_staining
  organelle: nucleus
  trained_on: joint_ipsc_confocal_a549_mantis
  predict_set: a549_mantis_h2b_mock
  model_name: fnet2d
  experiment_id: nucleus__joint_ipsc_confocal_a549_mantis__fnet2d__a549_mantis_h2b_mock
  # Override the iPSC-side `nucleus` target with a549's gene-keyed `h2b`.
  dataset_ref:
    target: h2b

model:
  init_args:
    ckpt_path: /hpc/projects/comp.micro/virtual_staining/models/dynacell/joint/nucleus/fnet2d/checkpoints/epoch=339-step=181220-loss=1.220.ckpt

data:
  init_args:
    normalizations:
      - class_path: viscy_transforms.NormalizeSampled
        init_args:
          keys: [Phase3D]
          level: fov_statistics
          subtrahend: mean
          divisor: std
    augmentations: []

trainer:
  callbacks:
    - class_path: viscy_utils.callbacks.prediction_writer.HCSPredictionWriter
      init_args:
        output_store: /hpc/projects/virtual_staining/training/dynacell/nucleus/fnet2d/joint/a549__mock/prediction.zarr

launcher:
  job_name: FNet2D_PRED_NUCL_JOINTTR_MOCK
  run_root: /hpc/projects/virtual_staining/training/dynacell/nucleus/fnet2d/joint/a549__mock
