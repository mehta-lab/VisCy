# FNet2D predict: nucleus (NUCL) trained on ipsc_confocal, tested on iPSC confocal.
# In-focus 2D track (Phase F). The 2D checkpoint predicts over the FULL-Z 3D test
# store with z_window_size=1 (fnet2d_predict overlay), emitting one window per
# z-plane -> a full-extent prediction store the existing focus-aware eval consumes
# unchanged. Source normalization (Phase3D fov_statistics mean/std) reproduces the
# fnet2d fit overlay exactly; a mismatch here would silently degrade predictions.
# Best val-loss checkpoint: epoch=480-step=160173-loss=1.362.ckpt (loss/validate=1.362).
base:
  - ../../../_internal/shared/model/predict_sets/ipsc_confocal.yml
  - ../../../_internal/shared/model/targets/nucleus.yml
  - ../../../_internal/shared/model/model_overlays/fnet2d_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/mode_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/hardware_predict_any_gpu.yml
  - ../../../_internal/shared/model/launcher_profiles/runtime_shared.yml

benchmark:
  task: virtual_staining
  organelle: nucleus
  trained_on: ipsc_confocal
  predict_set: ipsc_confocal
  model_name: fnet2d
  experiment_id: nucleus__ipsc_confocal__fnet2d__ipsc_confocal

model:
  init_args:
    ckpt_path: /hpc/projects/comp.micro/virtual_staining/models/dynacell/ipsc/nucleus/fnet2d/checkpoints/epoch=480-step=160173-loss=1.362.ckpt

data:
  init_args:
    # 2D benchmark (focus2d.halfwidth=1): predict only the 3-plane focus slab of each
    # FOV/timepoint listed in this plane file (precompute-gt build.focus_planes, resolved
    # exactly as the focus2d eval resolves it); every other plane of the full-extent store
    # stays empty. Set null to predict every plane (output_store prediction.zarr).
    predict_z_planes: /hpc/projects/virtual_staining/training/dynacell/focus2d_planes/nucleus/ipsc__h1.json
    normalizations:
      - class_path: viscy_transforms.NormalizeSampled
        init_args:
          keys: [Phase3D]
          level: fov_statistics
          subtrahend: mean
          divisor: std
    augmentations: []

trainer:
  callbacks:
    - class_path: viscy_utils.callbacks.prediction_writer.HCSPredictionWriter
      init_args:
        output_store: /hpc/projects/virtual_staining/training/dynacell/nucleus/fnet2d/ipsc/ipsc/prediction_focus2d_h1.zarr

launcher:
  job_name: FNet2D_PRED_NUCL
  run_root: /hpc/projects/virtual_staining/training/dynacell/nucleus/fnet2d/ipsc/ipsc
