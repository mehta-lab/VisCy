# FNet3DVSAug predict (Phase 15): nucleus trained on iPSC, predicting against
# a549-mantis-h2b-zikv test.
# Arm B of the FNet3D patch-vs-augmentation ablation: the same larger
# 384^2 patch plus the full VSCyto3D augmentation stack. Arm A vs Arm B is the
# clean augmentation comparison (identical geometry, batch and precision).
#
# Pinned to the BEST val-loss checkpoint (epoch 28, loss/validate=0.776), NOT
# `last.ckpt`: this arm's val loss rises after an early minimum, and checkpoint
# writes also stopped ~3 h before the job ended, so `last.ckpt` is neither the
# best nor the final state.
# A549 manifest keys nucleus by gene (`h2b`); override the iPSC-side `nucleus`
# target_id from targets/nucleus.yml so the resolver finds the h2b target.
base:
  - ../../../_internal/shared/model/predict_sets/a549_mantis_h2b_zikv.yml
  - ../../../_internal/shared/model/targets/nucleus.yml
  - ../../../_internal/shared/model/model_overlays/fnet3d_paper_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/mode_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/hardware_predict_any_gpu.yml
  - ../../../_internal/shared/model/launcher_profiles/runtime_shared.yml

benchmark:
  task: virtual_staining
  organelle: nucleus
  trained_on: ipsc_confocal
  predict_set: a549_mantis_h2b_zikv
  model_name: fnet3d_vscyto3daug
  experiment_id: nucleus__ipsc_confocal__fnet3d_vscyto3daug__a549_mantis_h2b_zikv
  # Override the iPSC-side `nucleus` target to a549's gene-keyed `h2b`.
  dataset_ref:
    target: h2b

model:
  init_args:
    ckpt_path: /hpc/projects/comp.micro/virtual_staining/models/dynacell/ipsc/nucleus/fnet3d_vscyto3daug/checkpoints/epoch=28-step=75400-loss=0.776.ckpt
data:
  init_args:
    normalizations:
      - class_path: viscy_transforms.NormalizeSampled
        init_args:
          keys: [Phase3D]
          level: fov_statistics
          subtrahend: mean
          divisor: std
    augmentations: []

trainer:
  callbacks:
    - class_path: viscy_utils.callbacks.prediction_writer.HCSPredictionWriter
      init_args:
        output_store: /hpc/projects/virtual_staining/training/dynacell/nucleus/fnet3d_vscyto3daug/ipsc/a549__zikv/prediction.zarr

launcher:
  job_name: FNet3DVSAug_PRED_NUCL_ON_A549_ZIKV
  run_root: /hpc/projects/virtual_staining/training/dynacell/nucleus/fnet3d_vscyto3daug/ipsc/a549__zikv
