# FNet3DVSAugBF predict: nucleus trained on ipsc_confocal_brightfield, BRIGHTFIELD input,
# predicting against a549_mantis_h2b_mock.
#
# Arm B of the FNet3D patch-vs-augmentation ablation: the same larger 384^2 patch
# plus the full VSCyto3D augmentation stack, now on brightfield input.
#
# Brightfield-input arm of nucleus/fnet3d_vscyto3daug/ipsc_confocal/predict__*.yml. Every
# field is copied from that phase baseline; the only differences are the input
# channel (dataset_ref.source_channel + the normalization key), the checkpoint,
# and the on-disk identity (train_set token `ipsc__bf`).
#
# Checkpoint is the loss/validate-monitored best, 0.6856 at epoch 51 of 0-76,
# read from the monitored ModelCheckpoint callback in last.ckpt -- that file also
# carries an unmonitored `latest-*` callback whose best_model_path is just the
# final step (epoch 76). The fit ran to `max_steps=200000` and val loss drifts up
# after the minimum, so `last.ckpt` is the wrong pin here as on the phase arm.
# Not directly comparable to the phase baseline's 0.776 (epoch 28): that
# run's checkpoint writes halted hours before it ended, so its retained best is a
# floor, not its true minimum.#
# A549 manifest keys nucleus by gene (`h2b`); override the iPSC-side
# `nucleus` target_id from targets/nucleus.yml so the resolver finds it.

base:
  - ../../../_internal/shared/model/predict_sets/a549_mantis_h2b_mock.yml
  - ../../../_internal/shared/model/targets/nucleus.yml
  - ../../../_internal/shared/model/model_overlays/fnet3d_paper_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/mode_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/hardware_predict_any_gpu.yml
  - ../../../_internal/shared/model/launcher_profiles/runtime_shared.yml

benchmark:
  task: virtual_staining
  organelle: nucleus
  trained_on: ipsc_confocal_brightfield
  predict_set: a549_mantis_h2b_mock
  model_name: fnet3d_vscyto3daug
  experiment_id: nucleus__ipsc_confocal_brightfield__fnet3d_vscyto3daug__a549_mantis_h2b_mock
  dataset_ref:
    source_channel: Brightfield
    target: h2b

model:
  init_args:
    ckpt_path: /hpc/projects/comp.micro/virtual_staining/models/dynacell/ipsc__bf/nucleus/fnet3d_vscyto3daug/checkpoints/epoch=51-step=135200-loss=0.686.ckpt

data:
  init_args:
    normalizations:
      - class_path: viscy_transforms.NormalizeSampled
        init_args:
          keys: [Brightfield]
          level: fov_statistics
          subtrahend: mean
          divisor: std
    augmentations: []

trainer:
  callbacks:
    - class_path: viscy_utils.callbacks.prediction_writer.HCSPredictionWriter
      init_args:
        output_store: /hpc/projects/virtual_staining/training/dynacell/nucleus/fnet3d_vscyto3daug/ipsc__bf/a549__mock/prediction.zarr

launcher:
  job_name: FNet3DVSAugBF_PRED_NUCL_ON_A549_MOCK
  run_root: /hpc/projects/virtual_staining/training/dynacell/nucleus/fnet3d_vscyto3daug/ipsc__bf/a549__mock
