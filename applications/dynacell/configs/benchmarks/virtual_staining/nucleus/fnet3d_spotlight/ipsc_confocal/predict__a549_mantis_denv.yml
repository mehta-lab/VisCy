# SPOTLIGHT ARM. Mechanical copy of the fnet3d_paper predict leaf: spotlight
# changes the training objective only, so inference, the predict model overlay
# and the Phase3D-only predict normalization are all identical to the baseline.
# Only model_name / experiment_id / ckpt_path / output_store / run_root /
# job_name differ.
#
# ⚠ ckpt_path names `last.ckpt` as a PLACEHOLDER -- the fit has not run yet.
# It is authored rather than left blank because `--ckpt best` resolves the
# checkpoint DIRECTORY from this field and exits if it is missing. Always
# submit with `--ckpt best`, and re-bake this path afterwards.
#
# FNet3D paper-baseline predict: nucleus trained on iPSC, predicting against a549-mantis-h2b-denv test.
# A549 manifest keys nucleus by gene (`h2b`); override the iPSC-side `nucleus`
# target_id from targets/nucleus.yml so the resolver finds the h2b target on
# a549-mantis-h2b-denv.
base:
  - ../../../_internal/shared/model/predict_sets/a549_mantis_h2b_denv.yml
  - ../../../_internal/shared/model/targets/nucleus.yml
  - ../../../_internal/shared/model/model_overlays/fnet3d_paper_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/mode_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/hardware_predict_any_gpu.yml
  - ../../../_internal/shared/model/launcher_profiles/runtime_shared.yml

benchmark:
  task: virtual_staining
  organelle: nucleus
  trained_on: ipsc_confocal
  predict_set: a549_mantis_h2b_denv
  model_name: fnet3d_spotlight
  experiment_id: nucleus__ipsc_confocal__fnet3d_spotlight__a549_mantis_h2b_denv
  # Override the iPSC-side `nucleus` target to a549's gene-keyed `h2b`.
  dataset_ref:
    target: h2b

model:
  init_args:
    ckpt_path: /hpc/projects/comp.micro/virtual_staining/models/dynacell/ipsc/nucleus/fnet3d_spotlight/checkpoints/last.ckpt

data:
  init_args:
    normalizations:
      - class_path: viscy_transforms.NormalizeSampled
        init_args:
          keys: [Phase3D]
          level: fov_statistics
          subtrahend: mean
          divisor: std
    augmentations: []

trainer:
  callbacks:
    - class_path: viscy_utils.callbacks.prediction_writer.HCSPredictionWriter
      init_args:
        output_store: /hpc/projects/virtual_staining/training/dynacell/nucleus/fnet3d_spotlight/ipsc/a549__denv/prediction.zarr

launcher:
  job_name: FNet3DSpotlight_PRED_NUCL_ON_A549_DENV
  run_root: /hpc/projects/virtual_staining/training/dynacell/nucleus/fnet3d_spotlight/ipsc/a549__denv
