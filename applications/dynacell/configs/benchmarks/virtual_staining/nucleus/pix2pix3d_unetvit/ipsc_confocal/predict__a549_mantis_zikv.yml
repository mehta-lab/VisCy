# pix2pix3d_unetvit predict: nucleus (Nuclei marker) trained on iPSC, predicting against a549_mantis_h2b_zikv test.
base:
  - ../../../_internal/shared/model/predict_sets/a549_mantis_h2b_zikv.yml
  - ../../../_internal/shared/model/targets/nucleus.yml
  - ../../../_internal/shared/model/model_overlays/pix2pix3d_unetvit_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/mode_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/hardware_predict_any_gpu.yml
  - ../../../_internal/shared/model/launcher_profiles/runtime_shared.yml

benchmark:
  task: virtual_staining
  organelle: nucleus
  trained_on: ipsc_confocal
  predict_set: a549_mantis_h2b_zikv
  model_name: pix2pix3d_unetvit
  experiment_id: nucleus__ipsc_confocal__pix2pix3d_unetvit__a549_mantis_h2b_zikv
  # A549 manifest keys nucleus by gene (`h2b`); override the iPSC-side
  # `nucleus` target from targets/nucleus.yml so the resolver finds h2b.
  dataset_ref:
    target: h2b

model:
  init_args:
    # Best loss/validate_ema checkpoint, modernized Run-D 40ep run (job
    # 33501549, converged early at epoch 15). The checkpoint was SELECTED on the
    # EMA loss but predict runs the raw generator: see the ema_kimg /
    # use_ema_at_predict block in model_overlays/pix2pix3d_unetvit_predict.yml,
    # which pins that explicitly.
    ckpt_path: /hpc/projects/comp.micro/virtual_staining/models/dynacell/ipsc/nucleus/pix2pix3d_unetvit/checkpoints/epoch=15-step=51200.ckpt

data:
  init_args:
    # override target-inherited normalizations: predict only reads source
    normalizations:
      - class_path: viscy_transforms.NormalizeSampled
        init_args:
          keys: [Phase3D]
          level: fov_statistics
          subtrahend: mean
          divisor: std
    # clear target-inherited RandWeightedCropd; predict has no CPU augs
    augmentations: []

trainer:
  callbacks:
    - class_path: viscy_utils.callbacks.prediction_writer.HCSPredictionWriter
      init_args:
        output_store: /hpc/projects/virtual_staining/training/dynacell/nucleus/pix2pix3d_unetvit/ipsc/a549__zikv/prediction.zarr
        # Take each plane from the depth window centred on it instead of the mean
        # of all 8 covering windows: that mean halves mid-band power (0.045 ->
        # 0.021 of ground truth on an in-domain membrane FOV) and cancels none of
        # the XY lattice, since all 8 share one XY grid.
        z_reduction: center

launcher:
  job_name: pix2pix3d_unetvit_PRED_NUCL_ON_A549_h2b_zikv
  run_root: /hpc/projects/virtual_staining/training/dynacell/nucleus/pix2pix3d_unetvit/ipsc/a549__zikv
