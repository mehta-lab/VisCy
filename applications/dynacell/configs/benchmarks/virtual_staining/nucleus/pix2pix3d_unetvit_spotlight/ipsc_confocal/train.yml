# pix2pix3d_unetvit MODERNIZED fit on nucleus (Nuclei channel of cell.zarr) — AICS iPSC confocal, 4-GPU DDP.
#
# Finalized "Run D" recipe: modernized overlay (nonsat + R1 + G-EMA, equal LR)
# + lambda_l1=10 + LeCam gamma=0.3 + 40 epochs. Those three deltas were the CLI
# overrides that produced the COMPLETED run at
# cell_diff_vs_viscy/ipsc/nucl/pix2pix3d_unetvit_modernized_lambdaL1_10_lecam_40ep
# (wandb best loss/validate_ema=0.585). Baked here so submission needs NO overrides.
base:
  - ../../../_internal/shared/model/train_sets/ipsc_confocal.yml
  - ../../../_internal/shared/model/targets/nucleus.yml
  - ../../../_internal/shared/model/data_overlays/unetvit3d_fit.yml
  - ../../../_internal/shared/model/model_overlays/pix2pix3d_unetvit_spotlight_fit_ddp_modernized.yml
  - ../../../_internal/shared/model/launcher_profiles/mode_fit.yml
  - ../../../_internal/shared/model/launcher_profiles/hardware_4gpu.yml
  - ../../../_internal/shared/model/launcher_profiles/runtime_shared.yml

benchmark:
  task: virtual_staining
  organelle: nucleus
  train_set: ipsc_confocal
  model_name: pix2pix3d_unetvit_spotlight
  experiment_id: nucleus__ipsc_confocal__pix2pix3d_unetvit_spotlight_modernized

data:
  init_args:
    # Spotlight needs the precomputed foreground mask from the store. Setting
    # fg_mask_key also makes HCSDataModule patch the mask into gpu_augmentations
    # so it is warped with the image; the engine re-binarizes it at the point of
    # use, because the affine resamples with bilinear interpolation.
    fg_mask_key: fg_mask
    # Coarse FOV-slab floor, NOT a per-patch filter: the fraction is measured on
    # the full-YX mask slab read before RandWeightedCropd runs, so it will
    # essentially never reject anything. The real guard against a degenerate
    # mask is the store-level foreground-fraction check in Phase 1.5.
    # nonzero_threshold is deliberately omitted: with fg_mask_key set the mask
    # branch is taken and it is never read.
    min_nonzero_fraction: 0.001
    normalizations:
      # Source stays mean/std ON PURPOSE, twice over. (1) It is what makes this a
      # matched comparison -- source preprocessing identical to the baseline.
      # (2) Phase 1 ran preprocess with --channel_names Nuclei/Membrane only, so
      # Phase3D carries NO otsu_threshold key, and NormalizeSampled indexes
      # level_meta[self.subtrahend] with no fallback -> hard KeyError on the
      # first batch.
      - class_path: viscy_transforms.NormalizeSampled
        init_args:
          keys: [Phase3D]
          level: fov_statistics
          subtrahend: mean
          divisor: std
      # Target Otsu-centred: the Dice term's tunable sigmoid clamps everything at
      # or below 0 to 0, so 0 must be the FG/BG boundary in the model's output
      # space. DIVISOR IS `iqr` because that is what this family's baseline
      # resolves to -- change the subtrahend, NEVER the divisor. deep_merge
      # REPLACES lists, so restating this block wholesale replaces whatever was
      # inherited; using the other family's divisor would silently change two
      # things at once and break the "only the loss differs" premise.
      - class_path: viscy_transforms.NormalizeSampled
        init_args:
          keys: [Nuclei]
          level: fov_statistics
          subtrahend: otsu_threshold
          divisor: iqr

model:
  init_args:
    lambda_l1: 10.0
    lecam_gamma: 0.3

trainer:
  max_epochs: 40
  logger:
    init_args:
      name: pix2pix3d_unetvit_spotlight_iPSC_NUCL_4gpu_modernized_lambdaL1_10_lecam_40ep
      save_dir: /hpc/projects/comp.micro/virtual_staining/models/dynacell/ipsc/nucleus/pix2pix3d_unetvit_spotlight
  callbacks:
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: loss/validate_ema
        filename: "epoch={epoch}-step={step}-loss={loss/validate_ema:.3f}"
        auto_insert_metric_name: false
        every_n_epochs: 1
        save_top_k: 4
        save_last: true
        dirpath: /hpc/projects/comp.micro/virtual_staining/models/dynacell/ipsc/nucleus/pix2pix3d_unetvit_spotlight/checkpoints

launcher:
  job_name: pix2pix3d_unetvit_spotlight_iPSC_NUCL_4gpu_modernized_lambdaL1_10_lecam_40ep
  run_root: /hpc/projects/comp.micro/virtual_staining/models/dynacell/ipsc/nucleus/pix2pix3d_unetvit_spotlight
  # pix2pix3d GAN (UNetViT3D G + multiscale-patch D, large 3D crops) OOMs on
  # 80 GB h100; needs h200 (141 GB). Narrow the hardware_4gpu h100|h200 default.
  sbatch:
    constraint: h200
