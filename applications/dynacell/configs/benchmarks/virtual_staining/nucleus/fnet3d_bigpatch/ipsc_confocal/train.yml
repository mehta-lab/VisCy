# FNet3D "larger-patch, simple-augs" ablation (Arm A) on nucleus (Nuclei
# channel of cell.zarr) — AICS iPSC confocal. Isolates the patch-size
# effect: identical to the fnet3d_paper iPSC nucleus fit except the spatial
# patch grows 64x64 -> 384x384 (data_overlays/fnet3d_bigpatch_fit.yml) and
# precision switches to bf16-mixed. Augmentations stay FNet3D-simple (axis
# flips), so the only delta from fnet3d_vscyto3daug (Arm B) is the augs.
# The data overlay keys norm/aug/val on Structure; nucleus target_channel
# is Nuclei, so we list-replace those three lists here to re-key them.
base:
  - ../../../_internal/shared/model/train_sets/ipsc_confocal.yml
  - ../../../_internal/shared/model/targets/nucleus.yml
  - ../../../_internal/shared/model/data_overlays/fnet3d_bigpatch_fit.yml
  - ../../../_internal/shared/model/model_overlays/fnet3d_paper_fit.yml
  - ../../../_internal/shared/model/launcher_profiles/mode_fit.yml
  - ../../../_internal/shared/model/launcher_profiles/hardware_gpu_any_long.yml
  - ../../../_internal/shared/model/launcher_profiles/runtime_shared.yml

benchmark:
  task: virtual_staining
  organelle: nucleus
  train_set: ipsc_confocal
  model_name: fnet3d_bigpatch
  experiment_id: nucleus__ipsc_confocal__fnet3d_bigpatch

trainer:
  # bf16-mixed halves the 384x384x32 activation footprint; MSE loss is
  # immune to the bf16-SSIM cancellation issue. Must match
  # fnet3d_vscyto3daug (Arm B) for a clean augmentation-only comparison.
  precision: bf16-mixed
  logger:
    init_args:
      name: FNet3D_BigPatch_iPSC_NUCL
      save_dir: /hpc/projects/comp.micro/virtual_staining/models/dynacell/ipsc/nucleus/fnet3d_bigpatch
  callbacks:
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: loss/validate
        filename: "epoch={epoch}-step={step}-loss={loss/validate:.3f}"
        auto_insert_metric_name: false
        every_n_epochs: 1
        save_top_k: 4
        save_last: true
        dirpath: /hpc/projects/comp.micro/virtual_staining/models/dynacell/ipsc/nucleus/fnet3d_bigpatch/checkpoints

data:
  init_args:
    normalizations:
      - class_path: viscy_transforms.NormalizeSampled
        init_args:
          keys: [Phase3D]
          level: fov_statistics
          subtrahend: mean
          divisor: std
      - class_path: viscy_transforms.NormalizeSampled
        init_args:
          keys: [Nuclei]
          level: fov_statistics
          subtrahend: mean
          divisor: std
    augmentations:
      - class_path: viscy_transforms.RandWeightedCropd
        init_args:
          keys: [Phase3D, Nuclei]
          w_key: Nuclei
          spatial_size: [32, 384, 384]
          num_samples: 4
    val_augmentations:
      - class_path: viscy_transforms.CenterSpatialCropd
        init_args:
          keys: [Phase3D, Nuclei]
          roi_size: [32, 384, 384]

launcher:
  job_name: FNet3DBigPatch_iPSC_NUCL
  run_root: /hpc/projects/comp.micro/virtual_staining/models/dynacell/ipsc/nucleus/fnet3d_bigpatch
  # 384x384x32 needs a large-memory GPU; pin H200. cell.zarr-backed preload
  # pushes MaxVMSize past the shared 256G cap; mem 512G matches fnet3d iPSC.
  sbatch:
    constraint: h200
    mem: "512G"
