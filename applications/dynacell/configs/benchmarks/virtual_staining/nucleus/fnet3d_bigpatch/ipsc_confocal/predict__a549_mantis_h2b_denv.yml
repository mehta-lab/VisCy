# FNet3DBigPatch predict (Phase 15): nucleus trained on iPSC, predicting against
# a549-mantis-h2b-denv test.
# Arm A of the FNet3D patch-vs-augmentation ablation: the larger 384^2
# training patch with FNet's flip-only augmentations.
#
# Pinned to the BEST val-loss checkpoint (epoch 43, loss/validate=0.788), NOT
# `last.ckpt`: this arm's val loss rises after an early minimum, and checkpoint
# writes also stopped ~3 h before the job ended, so `last.ckpt` is neither the
# best nor the final state.
# A549 manifest keys nucleus by gene (`h2b`); override the iPSC-side `nucleus`
# target_id from targets/nucleus.yml so the resolver finds the h2b target.
base:
  - ../../../_internal/shared/model/predict_sets/a549_mantis_h2b_denv.yml
  - ../../../_internal/shared/model/targets/nucleus.yml
  - ../../../_internal/shared/model/model_overlays/fnet3d_paper_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/mode_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/hardware_predict_any_gpu.yml
  - ../../../_internal/shared/model/launcher_profiles/runtime_shared.yml

benchmark:
  task: virtual_staining
  organelle: nucleus
  trained_on: ipsc_confocal
  predict_set: a549_mantis_h2b_denv
  model_name: fnet3d_bigpatch
  experiment_id: nucleus__ipsc_confocal__fnet3d_bigpatch__a549_mantis_h2b_denv
  # Override the iPSC-side `nucleus` target to a549's gene-keyed `h2b`.
  dataset_ref:
    target: h2b

model:
  init_args:
    ckpt_path: /hpc/projects/comp.micro/virtual_staining/models/dynacell/ipsc/nucleus/fnet3d_bigpatch/checkpoints/epoch=43-step=114400-loss=0.788.ckpt
data:
  init_args:
    normalizations:
      - class_path: viscy_transforms.NormalizeSampled
        init_args:
          keys: [Phase3D]
          level: fov_statistics
          subtrahend: mean
          divisor: std
    augmentations: []

trainer:
  callbacks:
    - class_path: viscy_utils.callbacks.prediction_writer.HCSPredictionWriter
      init_args:
        output_store: /hpc/projects/virtual_staining/training/dynacell/nucleus/fnet3d_bigpatch/ipsc/a549__denv/prediction.zarr

launcher:
  job_name: FNet3DBigPatch_PRED_NUCL_ON_A549_DENV
  run_root: /hpc/projects/virtual_staining/training/dynacell/nucleus/fnet3d_bigpatch/ipsc/a549__denv
