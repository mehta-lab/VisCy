# Voxel-matched FNet-2D ablation — nucleus (Nuclei), iPSC-trained.
#
# IDENTICAL to nucleus/fnet2d/ipsc_confocal/train.yml except batch_size
# 48 -> 1536 (and the run name/paths). fnet2d and fnet3d_paper already match on
# optimizer steps (max_steps 200000), samples/step (48), 64x64 XY patch, flip-only
# augs, lr, loss and fp32 — but fnet3d_paper's samples are 32 planes deep, so it
# supervises 48 x 32 = 1536 target planes per step against fnet2d's 48.
# 1536 = 48 x 32 closes that 32x gap. num_samples stays 8 (same crop sampler),
# so each step draws 1536 / 8 = 192 single-plane windows.
#
# Question it answers: does 3D beat 2D on the budget-matched FNet pair because of
# z-CONTEXT, or because it saw 32x more supervised voxels? If this arm closes the
# gap to fnet3d_paper, it was supervision; if it stays at fnet2d, it was context.
# Caveat: a 32x larger batch at the same constant lr also changes the optimizer's
# gradient noise, so this is a voxel-matched arm, not a pure-supervision control.
#
base:
  - ../../../_internal/shared/model/train_sets/ipsc_confocal.yml
  - ../../../_internal/shared/model/targets/nucleus.yml
  - ../../../_internal/shared/model/data_overlays/fnet2d_fit.yml
  - ../../../_internal/shared/model/model_overlays/fnet2d_fit.yml
  - ../../../_internal/shared/model/launcher_profiles/mode_fit.yml
  - ../../../_internal/shared/model/launcher_profiles/hardware_gpu_any_long.yml
  - ../../../_internal/shared/model/launcher_profiles/runtime_shared.yml

benchmark:
  task: virtual_staining
  organelle: nucleus
  train_set: ipsc_confocal
  model_name: fnet2d_voxelmatched
  experiment_id: nucleus__ipsc_confocal__fnet2d_voxelmatched
  # Disable the manifest resolver: the 2D track reads the offline focus
  # store, not the manifest-registered cell.zarr. dataset_ref: null makes
  # the compose hook a no-op so data fields can be declared inline.
  dataset_ref: null

data:
  init_args:
    # 48 x 32 — voxel parity with fnet3d_paper (see header).
    batch_size: 1536
    # iPSC in-focus slab store + channels — resolver disabled above.
    source_channel: Phase3D
    target_channel: Nuclei
    data_path: /hpc/projects/virtual_staining/training/dynacell/ipsc/dataset_v4/train/cell_focus.zarr
    normalizations:
      - class_path: viscy_transforms.NormalizeSampled
        init_args:
          keys: [Phase3D]
          level: fov_statistics
          subtrahend: mean
          divisor: std
      - class_path: viscy_transforms.NormalizeSampled
        init_args:
          keys: [Nuclei]
          level: fov_statistics
          subtrahend: mean
          divisor: std
    augmentations:
      - class_path: viscy_transforms.RandWeightedCropd
        init_args:
          keys: [Phase3D, Nuclei]
          w_key: Nuclei
          spatial_size: [1, 64, 64]
          num_samples: 8
    val_augmentations:
      - class_path: viscy_transforms.CenterSpatialCropd
        init_args:
          keys: [Phase3D, Nuclei]
          roi_size: [1, 64, 64]

trainer:
  logger:
    init_args:
      name: FNet2D_VoxMatch_iPSC_NUCL
      save_dir: /hpc/projects/comp.micro/virtual_staining/models/dynacell/ipsc/nucleus/fnet2d_voxelmatched
  callbacks:
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: loss/validate
        filename: "epoch={epoch}-step={step}-loss={loss/validate:.3f}"
        auto_insert_metric_name: false
        every_n_epochs: 1
        save_top_k: 4
        save_last: true
        dirpath: /hpc/projects/comp.micro/virtual_staining/models/dynacell/ipsc/nucleus/fnet2d_voxelmatched/checkpoints

launcher:
  job_name: FNet2DVoxMatch_iPSC_NUCL
  run_root: /hpc/projects/comp.micro/virtual_staining/models/dynacell/ipsc/nucleus/fnet2d_voxelmatched
  # 128G: the in-focus slab store is a 5-plane slice of the full-Z 3D store
  # (~1/4 the Z), so the 512G headroom the 3D leaf needed for cell.zarr
  # mmap_preload is wasteful and delays scheduling.
  sbatch:
    mem: "128G"
