# FCMAE-2D Pretrained (VSCyto2D) predict: membrane trained on a549_mantis,
# tested on a549-mantis-caax-mock. In-focus 2D track. Runs the 2D model over the
# full-Z 3D test store (z_window_size=1 -> one window per z-plane;
# the writer keys each output to its z-index) so the existing
# focus-aware eval consumes the result unchanged.
#
# Source normalization reproduces the fit overlay exactly
# (Phase3D fov_statistics mean/std); a mismatch here would
# silently degrade every prediction.
#
# ckpt_path pins the lowest-val-loss retained checkpoint of the
# 2026-08-01 revived fit (the earlier cohort froze at init under
# 16-mixed and its checkpoints are NOT usable). Submit with
# `--ckpt best` to re-resolve against the live best at submit time.
base:
  - ../../../_internal/shared/model/predict_sets/a549_mantis_caax_mock.yml
  - ../../../_internal/shared/model/targets/membrane.yml
  - ../../../_internal/shared/model/model_overlays/fcmae_vscyto2d_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/mode_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/hardware_predict_any_gpu.yml
  - ../../../_internal/shared/model/launcher_profiles/runtime_shared.yml

benchmark:
  task: virtual_staining
  organelle: membrane
  trained_on: a549_mantis
  predict_set: a549_mantis_caax_mock
  model_name: fcmae_vscyto2d_pretrained
  experiment_id: membrane__a549_mantis__fcmae_vscyto2d_pretrained__a549_mantis_caax_mock
  # A549 keys membrane by gene (`caax`); override the iPSC-side
  # target_id so the resolver finds it on a549_mantis_caax_mock.
  dataset_ref:
    target: caax

model:
  init_args:
    ckpt_path: /hpc/projects/comp.micro/virtual_staining/models/dynacell/a549/membrane/fcmae_vscyto2d_pretrained/checkpoints/epoch=74-step=22500-loss=0.401.ckpt

data:
  init_args:
    normalizations:
      - class_path: viscy_transforms.NormalizeSampled
        init_args:
          keys: [Phase3D]
          level: fov_statistics
          subtrahend: mean
          divisor: std
    augmentations: []

trainer:
  callbacks:
    - class_path: viscy_utils.callbacks.prediction_writer.HCSPredictionWriter
      init_args:
        output_store: /hpc/projects/virtual_staining/training/dynacell/membrane/fcmae_vscyto2d_pretrained/a549/a549__mock/prediction.zarr

launcher:
  job_name: FCMAE2D_Pretrained_PRED_A549TR_MEMB_ON_A549_MOCK
  run_root: /hpc/projects/virtual_staining/training/dynacell/membrane/fcmae_vscyto2d_pretrained/a549/a549__mock
