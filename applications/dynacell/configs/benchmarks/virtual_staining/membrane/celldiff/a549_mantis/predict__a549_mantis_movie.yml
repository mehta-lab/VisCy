# CellDiff r2 predict: membrane trained on a549_mantis, predicting on the
# cropped A549 TOMM20 DENV movie zarr (125 timepoints).
# No predict_set base — data path set directly to bypass the manifest system.
base:
  - ../../../_internal/shared/model/targets/membrane.yml
  - ../../../_internal/shared/model/model_overlays/celldiff_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/mode_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/hardware_predict_celldiff.yml
  - ../../../_internal/shared/model/launcher_profiles/runtime_shared.yml

benchmark:
  task: virtual_staining
  organelle: membrane
  trained_on: a549_mantis
  predict_set: a549_mantis_movie
  model_name: celldiff
  experiment_id: membrane__a549_mantis__celldiff__a549_mantis_movie

model:
  init_args:
    ckpt_path: /hpc/projects/comp.micro/virtual_staining/models/cell_diff_vs_viscy/a549_mantis/memb/celldiff_r2/checkpoints/last.ckpt
    predict_method: iterative
    predict_overlap: [4, 256, 256]

data:
  class_path: viscy_data.hcs.HCSDataModule
  init_args:
    data_path: /hpc/projects/virtual_staining/training/dynacell/a549/movie/2024_11_21_A549_TOMM20_DENV_crop.zarr
    source_channel: Phase3D
    target_channel: Membrane
    normalizations:
      - class_path: viscy_transforms.MinMaxSampled
        init_args:
          keys: [Phase3D]
          level: timepoint_statistics
    augmentations: []
    z_window_size: 48

trainer:
  callbacks:
    - class_path: viscy_utils.callbacks.prediction_writer.HCSPredictionWriter
      init_args:
        output_store: /hpc/projects/virtual_staining/training/dynacell/a549/movie_predictions/memb_celldiff_r2_a549trained_movie.zarr

launcher:
  job_name: CELLDiff_A549_PRED_MEMB_MOVIE
  run_root: /hpc/projects/virtual_staining/training/dynacell/a549/movie_predictions
