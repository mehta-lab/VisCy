# SPOTLIGHT ARM. Mechanical copy of the pix2pix2d_unetvit predict leaf: spotlight
# changes the training objective only, so inference, the predict model overlay
# and the Phase3D-only predict normalization are all identical to the baseline.
# Only model_name / experiment_id / ckpt_path / output_store / run_root /
# job_name differ.
#
# ⚠ ckpt_path names `last.ckpt` as a PLACEHOLDER -- the fit has not run yet.
# It is authored rather than left blank because `--ckpt best` resolves the
# checkpoint DIRECTORY from this field and exits if it is missing. Always
# submit with `--ckpt best`, and re-bake this path afterwards.
#
# pix2pix2d predict: membrane trained on ipsc_confocal, tested on A549 mantis denv.
# In-focus 2D track. The Z=1 checkpoint predicts over the FULL-Z 3D test store
# with z_window_size=1 (pix2pix2d_unetvit_predict overlay), emitting one window
# per z-plane -> a full-Z prediction store the existing focus-aware eval consumes
# unchanged.
#
# Source normalization is NormalizeSampled(Phase3D, fov_statistics, mean/std),
# reproducing the pix2pix2d fit exactly — the fit inherits it from
# targets/membrane.yml and a MinMax source here would silently degrade every
# prediction. The target-inherited RandWeightedCropd is cleared: predict has no
# CPU augmentations.
#
# predict_method=sliding_window and predict_overlap Z=0 are overlay-owned; see
# model_overlays/pix2pix2d_unetvit_predict.yml for why (the lateral ViT 512x512
# limit, and Z patch 1) -- it states the per-test-set caveat this leaf cannot.
#
# No z_reduction: at z_window_size=1 each plane comes from exactly one window, so
# there is nothing to reduce across (the 3D pix2pix leaves need `center` only
# because their 8-plane windows overlap).
#
base:
  - ../../../_internal/shared/model/predict_sets/a549_mantis_caax_denv.yml
  - ../../../_internal/shared/model/targets/membrane.yml
  - ../../../_internal/shared/model/model_overlays/pix2pix2d_unetvit_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/mode_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/hardware_predict_any_gpu.yml
  - ../../../_internal/shared/model/launcher_profiles/runtime_shared.yml

benchmark:
  task: virtual_staining
  organelle: membrane
  trained_on: ipsc_confocal
  predict_set: a549_mantis_caax_denv
  model_name: pix2pix2d_unetvit_spotlight
  experiment_id: membrane__ipsc_confocal__pix2pix2d_unetvit_spotlight__a549_mantis_caax_denv
  # A549 keys this organelle by gene; override the iPSC-side target
  # from the target fragment so the resolver finds it on the A549 set.
  dataset_ref:
    target: caax

model:
  init_args:
    ckpt_path: /hpc/projects/comp.micro/virtual_staining/models/dynacell/ipsc/membrane/pix2pix2d_unetvit_spotlight/checkpoints/last.ckpt

data:
  init_args:
    normalizations:
      - class_path: viscy_transforms.NormalizeSampled
        init_args:
          keys: [Phase3D]
          level: fov_statistics
          subtrahend: mean
          divisor: std
    augmentations: []

trainer:
  callbacks:
    - class_path: viscy_utils.callbacks.prediction_writer.HCSPredictionWriter
      init_args:
        output_store: /hpc/projects/virtual_staining/training/dynacell/membrane/pix2pix2d_unetvit_spotlight/ipsc/a549__denv/prediction.zarr

launcher:
  job_name: pix2pix2D_spotlight_PRED_MEMB_ON_A549_DENV
  run_root: /hpc/projects/virtual_staining/training/dynacell/membrane/pix2pix2d_unetvit_spotlight/ipsc/a549__denv
