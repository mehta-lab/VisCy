# pix2pix2d `wmatch` arm (fit) of membrane/pix2pix2d_unetvit/ipsc_confocal/train.yml.
# Recipe delta: warmup_steps 8500 -> 1328. Run-D's 8500-batch warmup is
# 13.3 % of the matching 3D fit (64000 batches); this 2D fit runs 10000, so
# round(8500 * 10000 / 64000) keeps the same schedule shape. The baseline's absolute 8500
# left 5 of 12 2D fits still warming up at their last step (wandb lr-AdamW, 2026-10-22).
# Everything else, and the rationale for it, is the baseline leaf's.
# Written by applications/dynacell/experiments/2026-10-22_2d-benchmark-paper-appendix/make_wmatch_fit_leaves.py.
base:
- ../../../_internal/shared/model/train_sets/ipsc_confocal.yml
- ../../../_internal/shared/model/targets/membrane.yml
- ../../../_internal/shared/model/data_overlays/pix2pix2d_unetvit_fit.yml
- ../../../_internal/shared/model/model_overlays/pix2pix2d_unetvit_fit.yml
- ../../../_internal/shared/model/launcher_profiles/mode_fit.yml
- ../../../_internal/shared/model/launcher_profiles/hardware_4gpu.yml
- ../../../_internal/shared/model/launcher_profiles/runtime_shared.yml
benchmark:
  task: virtual_staining
  organelle: membrane
  gene: Membrane
  target: membrane
  target_id: membrane
  train_set: ipsc_confocal
  model_name: pix2pix2d_unetvit_wmatch
  experiment_id: membrane__ipsc_confocal__pix2pix2d_unetvit_wmatch
  dataset_ref: null
data:
  init_args:
    source_channel: Phase3D
    target_channel: Membrane
    data_path: /hpc/projects/virtual_staining/training/dynacell/ipsc/dataset_v4/train/cell_focus.zarr
    augmentations:
    - class_path: viscy_transforms.RandWeightedCropd
      init_args:
        keys:
        - Phase3D
        - Membrane
        w_key: Membrane
        spatial_size:
        - 1
        - 624
        - 624
        num_samples: 2
trainer:
  logger:
    init_args:
      name: pix2pix2d_unetvit_wmatch_iPSC_MEMB
      save_dir: /hpc/projects/comp.micro/virtual_staining/models/dynacell/ipsc/membrane/pix2pix2d_unetvit_wmatch
  callbacks:
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: step
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      monitor: loss/validate_ema
      filename: epoch={epoch}-step={step}-loss={loss/validate_ema:.3f}
      auto_insert_metric_name: false
      every_n_epochs: 1
      save_top_k: 4
      save_last: true
      dirpath: /hpc/projects/comp.micro/virtual_staining/models/dynacell/ipsc/membrane/pix2pix2d_unetvit_wmatch/checkpoints
launcher:
  job_name: pix2pix2d_unetvit_wmatch_iPSC_MEMB
  run_root: /hpc/projects/comp.micro/virtual_staining/models/dynacell/ipsc/membrane/pix2pix2d_unetvit_wmatch
  sbatch:
    constraint: a40|a6000|l40s|h100|h200
    mem: 128G
model:
  init_args:
    warmup_steps: 1328
