# FNet2D predict: membrane (MEMB) trained on ipsc_confocal, tested on iPSC confocal.
# In-focus 2D track (Phase F). The 2D checkpoint predicts over the FULL-Z 3D test
# store with z_window_size=1 (fnet2d_predict overlay), emitting one window per
# z-plane -> a full-Z prediction store the existing focus-aware eval consumes
# unchanged. Source normalization (Phase3D fov_statistics mean/std) reproduces the
# fnet2d fit overlay exactly; a mismatch here would silently degrade predictions.
# Best val-loss checkpoint: epoch=437-step=145854-loss=0.641.ckpt (loss/validate=0.641).
base:
  - ../../../_internal/shared/model/predict_sets/ipsc_confocal.yml
  - ../../../_internal/shared/model/targets/membrane.yml
  - ../../../_internal/shared/model/model_overlays/fnet2d_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/mode_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/hardware_predict_any_gpu.yml
  - ../../../_internal/shared/model/launcher_profiles/runtime_shared.yml

benchmark:
  task: virtual_staining
  organelle: membrane
  trained_on: ipsc_confocal
  predict_set: ipsc_confocal
  model_name: fnet2d
  experiment_id: membrane__ipsc_confocal__fnet2d__ipsc_confocal

model:
  init_args:
    ckpt_path: /hpc/projects/comp.micro/virtual_staining/models/dynacell/ipsc/membrane/fnet2d/checkpoints/epoch=437-step=145854-loss=0.641.ckpt

data:
  init_args:
    normalizations:
      - class_path: viscy_transforms.NormalizeSampled
        init_args:
          keys: [Phase3D]
          level: fov_statistics
          subtrahend: mean
          divisor: std
    augmentations: []

trainer:
  callbacks:
    - class_path: viscy_utils.callbacks.prediction_writer.HCSPredictionWriter
      init_args:
        output_store: /hpc/projects/virtual_staining/training/dynacell/membrane/fnet2d/ipsc/ipsc/prediction.zarr

launcher:
  job_name: FNet2D_PRED_MEMB
  run_root: /hpc/projects/virtual_staining/training/dynacell/membrane/fnet2d/ipsc/ipsc
