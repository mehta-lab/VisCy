# pix2pix2d predict: er trained on a549_mantis, tested on A549 mantis mock.
# In-focus 2D track. The Z=1 checkpoint predicts over the FULL-Z 3D test store
# with z_window_size=1 (pix2pix2d_unetvit_predict overlay), emitting one window
# per z-plane -> a full-Z prediction store the existing focus-aware eval consumes
# unchanged.
#
# Source normalization is NormalizeSampled(Phase3D, fov_statistics, mean/std),
# reproducing the pix2pix2d fit exactly — the fit inherits it from
# targets/er_sec61b.yml and a MinMax source here would silently degrade every
# prediction. The target-inherited RandWeightedCropd is cleared: predict has no
# CPU augmentations.
#
# The overlay sets predict_method=sliding_window because the ViT generator is
# fixed at 512x512 by its positional embeddings while the A549 test set is
# 640x960, and predict_overlap Z is 0 because the Z patch is 1.
#
# No z_reduction: at z_window_size=1 each plane comes from exactly one window, so
# there is nothing to reduce across (the 3D pix2pix leaves need `center` only
# because their 8-plane windows overlap).
#
# Fit completion verified from the run log, not a checkpoint filename:
#   `Trainer.fit` stopped: `max_epochs=40` reached.
# Baked checkpoint is that run's best loss/validate_ema epoch.
base:
  - ../../../_internal/shared/model/predict_sets/a549_mantis_sec61b_mock.yml
  - ../../../_internal/shared/model/targets/er_sec61b.yml
  - ../../../_internal/shared/model/model_overlays/pix2pix2d_unetvit_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/mode_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/hardware_predict_any_gpu.yml
  - ../../../_internal/shared/model/launcher_profiles/runtime_shared.yml

benchmark:
  task: virtual_staining
  organelle: er
  trained_on: a549_mantis
  predict_set: a549_mantis_sec61b_mock
  model_name: pix2pix2d_unetvit
  experiment_id: er__a549_mantis__pix2pix2d_unetvit__a549_mantis_sec61b_mock

model:
  init_args:
    ckpt_path: /hpc/projects/comp.micro/virtual_staining/models/dynacell/a549/er/pix2pix2d_unetvit/checkpoints/epoch=39-step=9520-loss=0.743.ckpt

data:
  init_args:
    normalizations:
      - class_path: viscy_transforms.NormalizeSampled
        init_args:
          keys: [Phase3D]
          level: fov_statistics
          subtrahend: mean
          divisor: std
    augmentations: []

trainer:
  callbacks:
    - class_path: viscy_utils.callbacks.prediction_writer.HCSPredictionWriter
      init_args:
        output_store: /hpc/projects/virtual_staining/training/dynacell/er/pix2pix2d_unetvit/a549/a549__mock/prediction.zarr

launcher:
  job_name: pix2pix2D_PRED_A549_SEC61B_ON_A549_MOCK
  run_root: /hpc/projects/virtual_staining/training/dynacell/er/pix2pix2d_unetvit/a549/a549__mock
