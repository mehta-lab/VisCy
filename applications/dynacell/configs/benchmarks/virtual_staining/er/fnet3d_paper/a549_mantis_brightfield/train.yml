# FNet3D paper-baseline fit on ER (SEC61B marker) — A549 mantis-lightsheet pooled, BRIGHTFIELD input.
#
# Brightfield-input ablation arm of er/fnet3d_paper/a549_mantis/train.yml. Every
# hyperparameter is identical to that baseline; the only change is the model input
# channel (Brightfield instead of the Phase3D volume reconstructed from it), which
# enters via train_sets/a549_mantis_brightfield.yml's source_channel.
#
# ⚠ The baseline authors NO transform lists — it inherits them from
# targets/er_sec61b.yml as replaced by data_overlays/fnet3d_paper_fit.yml, which
# composes later and wins. So the live values are Structure mean/std, 32x64x64 and
# num_samples 8 -- NOT the target fragment's median/iqr, 13x624x624 and 2. The lists
# below are copied from that composed result; re-deriving them from the target
# fragment would silently change three hyperparameters.
#
# The pooled store also carries `Structure_deconvolved`; the target is the raw
# `Structure`, matching the baseline (the deconv token is retired).
base:
  - ../../../_internal/shared/model/train_sets/a549_mantis_brightfield.yml
  - ../../../_internal/shared/model/targets/er_sec61b.yml
  - ../../../_internal/shared/model/data_overlays/fnet3d_paper_fit.yml
  - ../../../_internal/shared/model/model_overlays/fnet3d_paper_fit.yml
  - ../../../_internal/shared/model/launcher_profiles/mode_fit.yml
  - ../../../_internal/shared/model/launcher_profiles/hardware_gpu_any_long.yml
  - ../../../_internal/shared/model/launcher_profiles/runtime_shared.yml

benchmark:
  task: virtual_staining
  organelle: er
  train_set: a549_mantis_brightfield
  model_name: fnet3d_paper
  experiment_id: er__a549_mantis_brightfield__fnet3d_paper

data:
  init_args:
    # A549 pooled store + target_channel — no resolver in this train_set.
    target_channel: Structure
    data_path: /hpc/projects/virtual_staining/training/dynacell/a549/mantis/train/SEC61B_all.zarr
    normalizations:
      - class_path: viscy_transforms.NormalizeSampled
        init_args:
          keys: [Brightfield]
          level: fov_statistics
          subtrahend: mean
          divisor: std
      - class_path: viscy_transforms.NormalizeSampled
        init_args:
          keys: [Structure]
          level: fov_statistics
          subtrahend: mean
          divisor: std
    augmentations:
      - class_path: viscy_transforms.RandWeightedCropd
        init_args:
          keys: [Brightfield, Structure]
          w_key: Structure
          spatial_size: [32, 64, 64]
          num_samples: 8
    val_augmentations:
      - class_path: viscy_transforms.CenterSpatialCropd
        init_args:
          keys: [Brightfield, Structure]
          roi_size: [32, 64, 64]

trainer:
  logger:
    init_args:
      name: FNet3D_A549bf_SEC61B_paper
      save_dir: /hpc/projects/comp.micro/virtual_staining/models/dynacell/a549__bf/er/fnet3d_paper
  callbacks:
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: loss/validate
        filename: "epoch={epoch}-step={step}-loss={loss/validate:.3f}"
        auto_insert_metric_name: false
        every_n_epochs: 1
        save_top_k: 4
        save_last: true
        dirpath: /hpc/projects/comp.micro/virtual_staining/models/dynacell/a549__bf/er/fnet3d_paper/checkpoints

launcher:
  job_name: FNet3DPaperBF_A549_SEC61B
  run_root: /hpc/projects/comp.micro/virtual_staining/models/dynacell/a549__bf/er/fnet3d_paper
  # 512G carried over from the phase baseline (mmap_preload peaks at
  # ~75 GB for SEC61B_all alone; the shared fnet3d a549/joint convention).
  sbatch:
    mem: "512G"
