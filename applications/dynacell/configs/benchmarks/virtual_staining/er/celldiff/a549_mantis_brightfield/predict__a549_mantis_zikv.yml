# CELLDiffBF predict: er trained on a549_mantis_brightfield, BRIGHTFIELD input,
# predicting against a549_mantis_sec61b_zikv.
#
# Brightfield-input ablation arm of
# er/celldiff/a549_mantis/predict__a549*.yml. Every field is copied
# from that phase baseline; the only differences are the input channel
# (dataset_ref.source_channel + the normalization key), the checkpoint, and the
# on-disk identity (train_set token `a549__bf`).
#
# save_top_k: -1 with no monitor on this arm, so the checkpoint is the FINAL
# epoch chosen explicitly, matching how the phase baseline pinned its own.
#
# A549 manifest keys er by gene (`sec61b`); override the iPSC-side
# `er` target_id from targets/er_sec61b.yml so the resolver finds it.

base:
  - ../../../_internal/shared/model/predict_sets/a549_mantis_sec61b_zikv.yml
  - ../../../_internal/shared/model/targets/er_sec61b.yml
  - ../../../_internal/shared/model/model_overlays/celldiff_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/mode_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/hardware_predict_celldiff.yml
  - ../../../_internal/shared/model/launcher_profiles/runtime_shared.yml

benchmark:
  task: virtual_staining
  organelle: er
  trained_on: a549_mantis_brightfield
  predict_set: a549_mantis_sec61b_zikv
  model_name: celldiff
  experiment_id: er__a549_mantis_brightfield__celldiff__a549_mantis_sec61b_zikv
  dataset_ref:
    source_channel: Brightfield
    target: sec61b

model:
  init_args:
    ckpt_path: /hpc/projects/comp.micro/virtual_staining/models/dynacell/a549__bf/er/celldiff_r2/checkpoints/epoch=19-step=66240.ckpt
    predict_method: iterative
    predict_overlap: [4, 256, 256]

data:
  init_args:
    normalizations:
      - class_path: viscy_transforms.MinMaxSampled
        init_args:
          keys: [Brightfield]
          level: timepoint_statistics
    augmentations: []
    z_window_size: 48

trainer:
  callbacks:
    - class_path: viscy_utils.callbacks.prediction_writer.HCSPredictionWriter
      init_args:
        output_store: /hpc/projects/virtual_staining/training/dynacell/er/celldiff_r2_iterative/a549__bf/a549__zikv/prediction.zarr

launcher:
  job_name: CELLDiffBF_PRED_SEC61B_A549TR_ON_A549_ZIKV
  run_root: /hpc/projects/virtual_staining/training/dynacell/er/celldiff_r2_iterative/a549__bf/a549__zikv
